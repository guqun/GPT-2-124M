<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3250" viewBox="0 0 2400 3250"><title>现代模型整合代码流程</title><style>text{font-family:PingFang SC,Helvetica Neue,Arial,sans-serif}</style><rect width="2400" height="3250" fill="#f8fafc"/><path d="M 1200 395 L 1200 429" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,429 1193.0,413.0 1207.0,413.0" fill="#087e75"/><path d="M 1200 615 L 1200 649" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,649 1193.0,633.0 1207.0,633.0" fill="#087e75"/><path d="M 1200 795 L 1200 829" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,829 1193.0,813.0 1207.0,813.0" fill="#087e75"/><path d="M 1175 1035 L 1225 1035" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1225,1035 1209.0,1042.0 1209.0,1028.0" fill="#087e75"/><path d="M 1200 1840 L 1200 1874" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1874 1193.0,1858.0 1207.0,1858.0" fill="#087e75"/><path d="M 1200 2020 L 1200 2054" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2054 1193.0,2038.0 1207.0,2038.0" fill="#087e75"/><path d="M 1160 2225 L 1240 2225" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1240,2225 1224.0,2232.0 1224.0,2218.0" fill="#087e75"/><path d="M 1200 2395 L 1200 2429" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2429 1193.0,2413.0 1207.0,2413.0" fill="#087e75"/><path d="M 1200 2615 L 1200 2649" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2649 1193.0,2633.0 1207.0,2633.0" fill="#087e75"/><path d="M 1200 2915 L 1200 2949" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2949 1193.0,2933.0 1207.0,2933.0" fill="#087e75"/><text x="60" y="80" font-size="43" fill="#172b40" font-weight="700" text-anchor="start">现代模型整合：同一个 ModernLM，完成训练、保存和缓存生成</text><text x="60" y="132" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">第23块 · 新文件保留全部前课 · 直接随机初始化 · 不是加载或合并 Llama/Qwen 的预训练权重</text><rect x="60" y="170" width="2280" height="225" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="85" y="214" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">01  配置与数据 | CPU 负责读取、分词、切分</text><text x="85" y="260" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">train_modern.py · load_config · L22 → prepare_local_data → SequentialBatches.next_batch</text><text x="85" y="299" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">模型：V=50257，D=128，L=2，Hq=4，Hkv=2，d=32，FFN=341；共享 E / lm_head。</text><text x="85" y="338" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">莎剧 → GPT-2 IDs → 前90% train / 后10% val；先切分再错位，标签不跨 train/val 边界。</text><text x="85" y="377" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每微批取257个ID：x=前256个 → [2,128]；y=后256个 → [2,128]；标签比输入向后1位。</text><rect x="60" y="430" width="2280" height="185" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="85" y="474" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">02  创建完整参数，再创建 AdamW | modern_model.py · ModernLM.__init__ · L102</text><text x="85" y="520" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">直接建立 Embedding、2个Block、最终RMSNorm、lm_head；不先构造GPT-2、不平均旧MHA权重。</text><text x="85" y="559" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">gamma 初值=1；矩阵正态初始化；输出残差投影缩放。已有模块按代码构造，不加载检查点。</text><text x="85" y="598" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">make_optimizer：二维矩阵做权重衰减，一维gamma不衰减；共享E只交给优化器一次。</text><rect x="60" y="650" width="2280" height="145" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="85" y="694" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">03  模型入口 | modern_model.py · ModernLM.forward · L146</text><text x="85" y="740" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">x [2,128] → E查表 [2,128,128]；没有学习式位置表相加；位置在每层的RoPE进入Q/K。</text><text x="85" y="779" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">默认device=cpu：以下运算都在CPU；显式选cuda/mps时，模型和当前batch一起移动到该设备。</text><rect x="45" y="830" width="2310" height="1010" rx="20" fill="#eef5f8" stroke="#355fc0" stroke-width="2"/><text x="75" y="875" font-size="33" fill="#355fc0" font-weight="700" text-anchor="start">04  一个 Block 内部 · 两层各有独立参数；输入与输出都为 [2,128,128]</text><rect x="75" y="905" width="1100" height="265" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="100" y="949" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">B1 → A1/A2：归一化、投影、位置</text><text x="100" y="995" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">X → RMSNorm① → U [2,128,128]。</text><text x="100" y="1034" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">Q=U Wqᵀ → [2,4,128,32]。</text><text x="100" y="1073" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">K/V=U Wkᵀ / U Wvᵀ → [2,2,128,32]。</text><text x="100" y="1112" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">Q/K头内RMSNorm：x / √(mean(x²)+ε) × γ。</text><text x="100" y="1151" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">再RoPE旋转Q/K；V不归一化、不旋转。</text><rect x="1225" y="905" width="1100" height="265" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="1250" y="949" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">A3/A4：分组注意力与输出投影</text><text x="1250" y="995" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">Q0/Q1读KV0，Q2/Q3读KV1；每个Q有自己的A/H。</text><text x="1250" y="1034" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">A=softmax(QKᵀ/√32 + 因果mask)。</text><text x="1250" y="1073" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">H=A×V → [2,4,128,32]。</text><text x="1250" y="1112" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">拼接四头 → [2,128,128]；O=C Woᵀ。</text><text x="1250" y="1151" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">推理才接入旧K/V；训练没有跨批缓存。</text><rect x="75" y="1205" width="2250" height="185" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="100" y="1249" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">第一次残差 | modern_model.py · ModernBlock.forward · L93</text><text x="100" y="1295" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">R = X + O → [2,128,128]；相同位置、相同维度逐元素相加。</text><text x="100" y="1334" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">这里的X是Block入口原向量，不是RMSNorm的输出U。</text><text x="100" y="1373" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">目的：主干保留原表示，并加入注意力读取到的上下文信息。</text><rect x="75" y="1425" width="2250" height="225" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="100" y="1469" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">第二条分支：RMSNorm② → SwiGLU → 第二次残差 | modern_model.py · ModernMLP.forward · L82</text><text x="100" y="1515" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">Z=RMSNorm②(R) → [2,128,128]；保留R作为第二次残差主干。</text><text x="100" y="1554" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">a=Z Wgateᵀ、v=Z Wupᵀ → 各 [2,128,341]；两路都读取完整Z。</text><text x="100" y="1593" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">u=SiLU(a) ⊙ v → [2,128,341]；F=u Wdownᵀ → [2,128,128]。</text><text x="100" y="1632" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">Y=R+F → [2,128,128]；交给下一个Block。MLP的v不是注意力V。</text><text x="85" y="1710" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">调用顺序：ModernLM.forward → ModernBlock.forward → ModernAttention.forward / ModernMLP.forward</text><text x="85" y="1760" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">数学原语复用：HeadRMSNorm、apply_rotary、grouped_attention；前课文件保持原样。</text><rect x="60" y="1875" width="2280" height="145" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="85" y="1919" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">05  全部 Block 后：最终 RMSNorm → lm_head</text><text x="85" y="1965" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">最终特征 [2,128,128]；logits = Hfinal Eᵀ → [2,128,50257]。</text><text x="85" y="2004" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">训练：每个位置都预测下一个Token；生成：只取最后位置，得到 [B,1,50257] 分数。</text><rect x="60" y="2055" width="1100" height="340" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="85" y="2099" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">06  训练：无 KV Cache</text><text x="85" y="2145" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">architecture_training.py · train_update · L84</text><text x="85" y="2184" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">logits与y → 256个位置的平均交叉熵loss。</text><text x="85" y="2223" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">loss/4.backward()；本次.grad加上历史.grad。</text><text x="85" y="2262" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">重复4个微批；中间不更新任何模型参数。</text><text x="85" y="2301" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">全局梯度裁剪 → AdamW.step() → 清梯度。</text><text x="85" y="2340" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">一次更新处理2×128×4=1024个预测位置。</text><text x="85" y="2379" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">共100次更新=102400个预测位置（默认）。</text><rect x="1240" y="2055" width="1100" height="340" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="1265" y="2099" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">07  验证：固定窗口、只观察</text><text x="1265" y="2145" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">architecture_training.py · evaluate · L61</text><text x="1265" y="2184" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">初始、每20次更新、最后一次更新后执行。</text><text x="1265" y="2223" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">eval + no_grad → 同一val窗口的平均loss。</text><text x="1265" y="2262" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">不backward、不更新、不改变训练游标。</text><text x="1265" y="2301" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">结束恢复原训练模式；继续下一次更新。</text><text x="1265" y="2340" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">PyTorch：矩阵运算、求导、裁剪、AdamW。</text><text x="1265" y="2379" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">本项目：取批、循环、模式切换、记录。</text><rect x="60" y="2430" width="2280" height="185" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="85" y="2474" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">08  保存 → 新建模型 → 严格加载 | train_modern.py · load_checkpoint · L48</text><text x="85" y="2520" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">checkpoint.pt：模型配置 + 参数 + AdamW状态 + 更新次数 + 数据游标；不保存KV Cache。</text><text x="85" y="2559" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">重建ModernLM，再load_state_dict(strict=True)；重载前后的同一提示词logits须完全相同。</text><text x="85" y="2598" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">生成入口可单独重载；本课未实现训练断点续跑（缺少完整恢复协议），不宣称可无缝续训。</text><rect x="60" y="2650" width="2280" height="265" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="85" y="2694" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">09  同一训练后模型生成 | modern_model.py · generate · L161</text><text x="85" y="2740" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">eval + inference_mode；prefill输入完整提示词[B,P]，保存每层K/V [B,2,P,32]。</text><text x="85" y="2779" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">最后位置logits → argmax得到新ID；下一轮只输入该新ID[B,1]。</text><text x="85" y="2818" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每层新Q/K先Norm再RoPE（位置偏移S）；新K/V追加旧缓存 → [B,2,S+1,32]。</text><text x="85" y="2857" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">读全部历史K/V算新位置H → 两次残差/MLP → 最终Norm/lm_head → 下一个ID。</text><text x="85" y="2896" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">生成N个ID后缓存长度P+N−1：最后选出的ID尚未再次送入模型；缓存不进入参数更新。</text><rect x="60" y="2950" width="2280" height="185" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="85" y="2994" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">10  核对与输出 | train_modern.py · generation_check · L57</text><text x="85" y="3040" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">同一模型分别做缓存生成与完整重算：贪心ID一致；沿相同前缀逐轮比较logits的浮点误差。</text><text x="85" y="3079" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">report.json记录配置、数据指纹、loss、gamma变化、缓存字节与检查点重载结果。</text><text x="85" y="3118" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">本课是整合流程验证；单次小语料短跑不证明优于GPT-2/Llama/Qwen，不保证流畅生成。</text><text x="60" y="3200" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">来源：既有单元3实践 + Transformers v4.51.3 Qwen3 的模块顺序；沿用本地RoPE配对、词表与共享输出表。</text></svg>