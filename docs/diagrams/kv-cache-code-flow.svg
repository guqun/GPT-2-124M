<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2850" viewBox="0 0 2400 2850"><title>KV Cache 代码与数值流转</title><style>text{font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style><rect width="2400" height="2850" fill="#f5f8fb"/><path d="M 610 390 L 610 435" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,435 603.0,419.0 617.0,419.0" fill="#355fc0"/><path d="M 1790 390 L 1790 435" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,435 1783.0,419.0 1797.0,419.0" fill="#087e75"/><path d="M 1200 640 L 1200 685" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,685 1193.0,669.0 1207.0,669.0" fill="#087e75"/><path d="M 610 890 L 610 935" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,935 603.0,919.0 617.0,919.0" fill="#355fc0"/><path d="M 1790 890 L 1790 935" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,935 1783.0,919.0 1797.0,919.0" fill="#087e75"/><path d="M 1790 1180 L 1790 1225" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1225 1783.0,1209.0 1797.0,1209.0" fill="#087e75"/><path d="M 1200 1470 L 1200 1515" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1515 1193.0,1499.0 1207.0,1499.0" fill="#087e75"/><path d="M 1200 1760 L 1200 1805" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1805 1193.0,1789.0 1207.0,1789.0" fill="#087e75"/><path d="M 1200 2135 L 1200 2180" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2180 1193.0,2164.0 1207.0,2164.0" fill="#087e75"/><path d="M 1200 2385 L 1200 2430" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2430 1193.0,2414.0 1207.0,2414.0" fill="#087e75"/><text x="60" y="80" font-size="48" fill="#172b40" font-weight="700" text-anchor="start">KV Cache：相同权重，复用历史 K/V</text><text x="60" y="136" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">只优化推理执行；保留 RoPE / RMSNorm / SwiGLU / MHA。缓存是激活值，不是参数，不是磁盘模型文件。</text><rect x="60" y="185" width="1100" height="205" rx="20" fill="#eef2ff" stroke="#dce4ec" stroke-width="2"/><text x="86" y="229" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">A · generate_cache_reference.py</text><text x="86" y="275" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每一轮重新送入完整 Token 前缀。</text><text x="86" y="316" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">ABC → 选 D；ABCD → 选 E；ABCDE → 选 F。</text><text x="86" y="357" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">调用 generate(..., use_cache=False)。</text><rect x="1240" y="185" width="1100" height="205" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="229" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">B · generate_kv_cache.py</text><text x="1266" y="275" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">第一次输入完整提示，之后只送最新 Token。</text><text x="1266" y="316" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">ABC → 选 D；D + 缓存 → 选 E；E + 缓存 → 选 F。</text><text x="1266" y="357" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">调用 generate(..., use_cache=True)。</text><rect x="1246" y="191" width="1088" height="193" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="435" width="2280" height="205" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="479" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">01  共同准备 · kv_cache_experiment.main</text><text x="86" y="525" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">默认相同 seed=42 随机小模型；也可两边明确指定同一份前课 SwiGLU 检查点。</text><text x="86" y="566" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">decoder = CachedDecoder(model).to(device).eval()；inference_mode 下不建反向图，不更新参数。</text><text x="86" y="607" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">默认合成提示 ID [1,2,…,32]，形状 [1,32]；固定贪心生成 16 个新 ID，不评价文本质量。</text><rect x="60" y="685" width="2280" height="205" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="729" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">02  首轮 prefill · generate · L28–47</text><text x="86" y="775" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">两边完整处理提示。每层：Norm1 → QKV/RoPE → 注意力 → 残差 → Norm2/SwiGLU → 残差。</text><text x="86" y="816" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">缓存版分别保留每一层的 (已旋转 K, 未旋转 V)，各 [1,4,32,32]；没有保存旧 Q。</text><text x="86" y="857" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">最终 RMSNorm → 末位置 lm_head → logits[1,1,50257] → argmax 选第一个新 Token。</text><rect x="60" y="935" width="1100" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="979" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">03 A · 下一轮完整前缀重算</text><text x="86" y="1025" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输入 ids[1,33]：提示 32 个 + 刚选出的 1 个。</text><text x="86" y="1066" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每层重新投影全部 33 个位置的 Q/K/V。</text><text x="86" y="1107" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">分数形状 [1,4,33,33]；旧位置 MLP 也重算。</text><text x="86" y="1148" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">最后仍然只取末位置的词表 logits。</text><rect x="1240" y="935" width="1100" height="245" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="979" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">03 B · 下一轮 decode</text><text x="1266" y="1025" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输入 ids[:,-1:][1,1]，携带各层旧缓存。</text><text x="1266" y="1066" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每层只投影这个新位置：Q/K/V[1,4,1,32]。</text><text x="1266" y="1107" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">旧长度 S=32 → 新 Q/K 用位置 32 做 RoPE。</text><text x="1266" y="1148" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">不是从位置 0 开始；V 不旋转。</text><rect x="1246" y="941" width="1088" height="233" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="1225" width="2280" height="245" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1269" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">04  展开缓存注意力 · attention_step · L13–38</text><text x="86" y="1315" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">[K1–K2] 新 x[1,1,128] → QKV → 新 Q/K 使用 cos[32:33]、sin[32:33]。</text><text x="86" y="1356" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">[K3] 旧 K[1,4,32,32] + 新 k[1,4,1,32] → 沿位置轴 cat → K[1,4,33,32]；V 同理。</text><text x="86" y="1397" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">[K4] 新 Q @ 全部 Kᵀ / √32 → 分数[1,4,1,33] → 因果遮罩/softmax → A。</text><text x="86" y="1438" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">A @ 全部 V → H[1,4,1,32] → 拼头/投影[1,1,128]；更新该层缓存，送回当前 Block。</text><rect x="66" y="1231" width="2268" height="233" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="1515" width="1100" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1559" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">05  每层独立保存 · CachedDecoder.forward</text><text x="86" y="1605" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">cache[0] = (第 0 层 K, 第 0 层 V)</text><text x="86" y="1646" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">cache[1] = (第 1 层 K, 第 1 层 V)</text><text x="86" y="1687" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每层只处理新位置的主干、残差和 MLP。</text><text x="86" y="1728" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新请求 cache=None；更新权重后也须丢弃缓存。</text><rect x="1240" y="1515" width="1100" height="245" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="1559" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">06  矩形遮罩：历史 3，新增 2 个位置</text><text x="1266" y="1605" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">                 key：0  1  2  3  4</text><text x="1266" y="1646" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">query 位置 3：      1  1  1  1  0</text><text x="1266" y="1687" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">query 位置 4：      1  1  1  1  1</text><text x="1266" y="1728" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">规则 key≤query；query 编号加历史长度。</text><rect x="1246" y="1521" width="1088" height="233" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="1805" width="2280" height="330" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1849" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">07  小数值例子：一层、一个 2 维头，已有 3 个位置，再加入位置 3</text><text x="86" y="1895" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">人工选值，Q/K 已经过位置处理：旧 K=[[1,0],[0,1],[1,1]]，旧 V=[[1,0],[0,2],[1,1]]。</text><text x="86" y="1936" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新 q=[1,0]、新 k=[2,1]、新 v=[2,0]；缓存拼接 K→4 行、V→4 行。</text><text x="86" y="1977" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新 q 与四行 K 点积=[1,0,1,2]，除 √2；位置 3 能看位置 0…3，不遮挡已有行。</text><text x="86" y="2018" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">softmax → A≈[0.221181, 0.109057, 0.221181, 0.448581]。</text><text x="86" y="2059" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">H[0]=A₀×1+A₁×0+A₂×1+A₃×2 ≈ 1.339523。</text><text x="86" y="2100" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">H[1]=A₀×0+A₁×2+A₂×1+A₃×0 ≈ 0.439296；旧 V 的内容仍参与输出。</text><rect x="60" y="2180" width="2280" height="205" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="2224" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">08  继续生成 · 新 Token 再回到第 03 步</text><text x="86" y="2270" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">当前新位置经过所有 Block → 最终 RMSNorm → lm_head → 贪心选下一 ID，拼到完整输出序列。</text><text x="86" y="2311" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">循环共 16 次：prefill 1 次 + decode 15 次。两边都只对末位置执行 lm_head。</text><text x="86" y="2352" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">最后一次选出的 Token 未再输入，所以缓存长度 47，最终输出序列长度 48。</text><rect x="60" y="2430" width="2280" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="2474" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">09  先验正确性，再比较时间和缓存 · compare_kv_cache_runs.py</text><text x="86" y="2520" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">同权重、同输入、同设备与代码协议 → 各轮完整词表 logits 近似相同 → 贪心 ID 相同。</text><text x="86" y="2561" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每层累计处理位置：重算 32+33+…+47=632；缓存 32+15=47。新 Q 仍需读取历史 K/V。</text><text x="86" y="2602" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">末次 K/V 有效字节：2(K/V)×2层×1batch×4头×47位置×32维×4字节 = 96,256。</text><text x="86" y="2643" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">预热 1 次，测量 3 次；分开记录 prefill/decode。缓存内存随长度增长，不计为模型参数。</text><text x="60" y="2740" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">边界：FP32、等长无 padding、固定容量；动态 cat 有复制开销，不含滑窗/缓存淘汰。下一小块才减少 KV 头数。</text><text x="60" y="2790" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">来源：Hugging Face 缓存说明、Meta Llama 3 Attention；本地图与数字为教学改编。</text></svg>