<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="2410" viewBox="0 0 1420 2410"><title>MoE 前向流程及专家 1 的 SwiGLU 计算</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#426279"/></marker></defs><rect width="1420" height="2410" fill="#f6f8f7"/><text x="50" y="70" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="44" fill="#18374a">MoE 前向流程   /   一个 Token，四位专家选两位</text><text x="52" y="115" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="24" fill="#465e69">橙色为稀疏 MoE 新增操作。绿色为每位专家独立拥有的 SwiGLU。所有矩阵采用行向量右乘。</text><text x="52" y="174" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="28" fill="#18374a" font-weight="700">沿专家 1 追踪一个 Token，每格是一个特征值</text><text x="52" y="221" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#146b64" font-weight="700">输入宽度 D = 2</text><rect x="52" y="238" width="94" height="54" rx="8" fill="#eaf5f1" stroke="#72a89f"/><text x="63" y="273" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#18374a" font-weight="700">1</text><rect x="154" y="238" width="94" height="54" rx="8" fill="#eaf5f1" stroke="#72a89f"/><text x="165" y="273" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#18374a" font-weight="700">1</text><text x="52" y="329" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#465e69" font-weight="400">完整的 z 同时送入 Wg 和 Wu</text><text x="500" y="221" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#146b64" font-weight="700">中间宽度 F = 3</text><rect x="500" y="238" width="94" height="54" rx="8" fill="#eaf5f1" stroke="#72a89f"/><text x="511" y="273" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#18374a" font-weight="700">2</text><rect x="602" y="238" width="94" height="54" rx="8" fill="#eaf5f1" stroke="#72a89f"/><text x="613" y="273" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#18374a" font-weight="700">1</text><rect x="704" y="238" width="94" height="54" rx="8" fill="#eaf5f1" stroke="#72a89f"/><text x="715" y="273" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#18374a" font-weight="700">3</text><text x="500" y="329" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#465e69" font-weight="400">v = z Wu，与 3 个门控系数逐项相乘</text><text x="965" y="221" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#146b64" font-weight="700">输出宽度 D = 2</text><rect x="965" y="238" width="94" height="54" rx="8" fill="#eaf5f1" stroke="#72a89f"/><text x="976" y="273" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#18374a" font-weight="700">0.655</text><rect x="1067" y="238" width="108" height="54" rx="8" fill="#eaf5f1" stroke="#72a89f"/><text x="1078" y="273" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#18374a" font-weight="700">−0.076</text><text x="965" y="329" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#465e69" font-weight="400">Wd 混合三个中间特征，得到专家输出</text><text x="370" y="274" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="25" fill="#146b64" font-weight="700">Wu  →</text><text x="824" y="253" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#465e69" font-weight="400">门控</text><text x="818" y="282" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="23" fill="#146b64" font-weight="700">Wd  →</text><g transform="translate(0,240)"><text x="50" y="195" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="33" fill="#18374a">一   从主干到专家，再回到主干</text><text x="52" y="236" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#465e69">下方跟踪同一个 Token。取 RMSNorm 的 γ = [1, 1] 并忽略 ε，便于手算。</text><rect x="245" y="270" width="925" height="96" rx="14" fill="#ffffff" stroke="#adc2c6" stroke-width="2"/><text x="267" y="308" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#18374a">主干 R = [1, 1]  →  RMSNorm  →  z = [1, 1]</text><text x="267" y="346" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">z 是这个位置经过注意力与第一次残差、再归一化后的特征。</text><path d="M710 366 V405" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="245" y="409" width="925" height="165" rx="14" fill="#fff3e9" stroke="#cd805a" stroke-width="2"/><text x="267" y="447" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#a34523">新增 ①   路由范围为 4 位专家，本 Token 选 2 位</text><text x="267" y="485" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">Wr [2×4] 的两行分别为 [0, ln 3, ln 2, 0] 和 [0, ln 2, 0, 0]。</text><text x="267" y="520" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">s = z Wr = [0, ln 6, ln 2, 0]，每一列对应一位专家。</text><text x="267" y="555" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">softmax(s) = [1, 6, 2, 1] / 10 = [0.10, 0.60, 0.20, 0.10]。</text><path d="M710 574 V605" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="245" y="608" width="925" height="117" rx="14" fill="#fff3e9" stroke="#cd805a" stroke-width="2"/><text x="267" y="646" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#a34523">新增 ②   选 Top-2，保留专家编号与合并权重</text><text x="267" y="684" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">专家 1、2 入选。权重分别为 0.60 / 0.80 = 0.75、0.20 / 0.80 = 0.25。</text><text x="267" y="719" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">向两位专家各送入完整 z；专家 0、3 跳过这个位置。</text><path d="M710 725 V750 H385 V775" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M710 750 H1010 V775" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="92" y="779" width="580" height="117" rx="14" fill="#eaf5f1" stroke="#72a89f" stroke-width="2"/><text x="114" y="817" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#146b64">专家 1   ·   计算过程见下半图</text><text x="114" y="855" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">输入 z = [1, 1]，使用专家 1 的 Wg、Wu、Wd。</text><text x="114" y="890" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">输出 e₁ ≈ [0.655, −0.076]。</text><rect x="713" y="779" width="570" height="117" rx="14" fill="#eaf5f1" stroke="#72a89f" stroke-width="2"/><text x="735" y="817" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#146b64">专家 2   ·   同一结构，另一套权重</text><text x="735" y="855" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">输入 z = [1, 1]，使用专家 2 的 Wg、Wu、Wd。</text><text x="735" y="890" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">输出 e₂ ≈ [−0.076, 2.193]。</text><path d="M385 896 V920 H710 V946" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1010 896 V920 H713" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="245" y="950" width="925" height="96" rx="14" fill="#fff3e9" stroke="#cd805a" stroke-width="2"/><text x="267" y="988" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#a34523">新增 ③   合并两位专家的输出</text><text x="267" y="1026" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">Δ = 0.75 × e₁ + 0.25 × e₂ ≈ [0.473, 0.491]。每个权重乘整个向量。</text><path d="M710 1046 V1072" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1170 319 H1344 V1121 H1174" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><text x="1203" y="305" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="19" fill="#465e69">保留原始 R</text><rect x="245" y="1076" width="925" height="91" rx="14" fill="#ffffff" stroke="#adc2c6" stroke-width="2"/><text x="267" y="1114" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#18374a">第二次残差相加   Y = R + Δ ≈ [1.473, 1.491]</text><text x="267" y="1152" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">输出仍为 2 维，作为当前位置传给下一个 Block 的特征。</text><text x="50" y="1250" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="33" fill="#18374a">二   展开专家 1，两条箭头从同一个 z 出发</text><text x="52" y="1291" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#465e69">矩阵的每一列决定一个输出特征如何组合所有输入维度。这里的 Wg、Wu、Wd 均为训练参数。</text><rect x="420" y="1313" width="580" height="88" rx="14" fill="#eaf5f1" stroke="#72a89f" stroke-width="2"/><text x="442" y="1351" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#146b64">专家 1 收到 z = [1, 1]</text><text x="442" y="1389" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">这同一行 2 维数据同时进入下面两次投影。</text><path d="M710 1401 V1422 H363 V1445" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M710 1422 H1048 V1445" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="52" y="1449" width="635" height="205" rx="14" fill="#eaf5f1" stroke="#72a89f" stroke-width="2"/><text x="74" y="1487" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#146b64">Wg [2×3]   ·   为三个中间特征算系数</text><text x="74" y="1525" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">矩阵两行   [1, 2, 0]、[0, −1, −1]</text><text x="74" y="1560" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">a = z Wg = [1, 1, −1]</text><text x="74" y="1595" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">例如第 2 项   1×2 + 1×(−1) = 1</text><text x="74" y="1630" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">g = SiLU(a) ≈ [0.731, 0.731, −0.269]</text><rect x="731" y="1449" width="635" height="205" rx="14" fill="#eaf5f1" stroke="#72a89f" stroke-width="2"/><text x="753" y="1487" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#146b64">Wu [2×3]   ·   提取三个待调节特征</text><text x="753" y="1525" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">矩阵两行   [1, 2, 1]、[1, −1, 2]</text><text x="753" y="1560" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">v = z Wu = [2, 1, 3]</text><text x="753" y="1595" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">例如第 3 项   1×1 + 1×2 = 3</text><text x="753" y="1630" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">输出 v 与左侧 g 按相同维度对齐。</text><path d="M363 1654 V1680 H710 V1706" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1048 1654 V1680 H713" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="150" y="1710" width="1120" height="107" rx="14" fill="#ffffff" stroke="#adc2c6" stroke-width="2"/><text x="172" y="1748" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#18374a">逐元素相乘   u = g ⊙ v</text><text x="172" y="1786" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">[0.731×2, 0.731×1, (−0.269)×3] ≈ [1.462, 0.731, −0.807]。这一步没有额外矩阵。</text><path d="M710 1817 V1847" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="150" y="1851" width="1120" height="175" rx="14" fill="#eaf5f1" stroke="#72a89f" stroke-width="2"/><text x="172" y="1889" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="27" fill="#146b64">Wd [3×2]   ·   把三个特征重新混合，算出两维专家输出</text><text x="172" y="1927" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">矩阵三行   [1, 0]、[0, 1]、[1, 1]。两列分别计算输出的两维。</text><text x="172" y="1962" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">第 1 维   1.462×1 + 0.731×0 + (−0.807)×1 ≈ 0.655</text><text x="172" y="1997" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="23" fill="#18374a">第 2 维   1.462×0 + 0.731×1 + (−0.807)×1 ≈ −0.076</text><path d="M710 2026 V2055" fill="none" stroke="#426279" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><text x="260" y="2091" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="700" font-size="26" fill="#146b64">e₁ ≈ [0.655, −0.076]    →    送回上半图的「③ 合并」，乘路由权重 0.75。</text><text x="54" y="2146" font-family="Hiragino Sans GB, Arial, sans-serif" font-weight="400" font-size="21" fill="#465e69">矩阵为教学取值。SiLU(a) = a / (1 + exp(−a))；显示值保留三位小数，输出按未舍入数值计算。</text></g></svg>