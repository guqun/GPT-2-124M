<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="3041" viewBox="0 0 2600 3041">
<title>2/3  注意力计算与第一次残差：输入 → 计算 → 输出</title><desc>逐步标注输入、参数、计算、输出形状和差异 A 到 F；数字为缩小教学配置。</desc>
<style>text {font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style>
<rect width="2600" height="3041" fill="#f5f8fb"/><text x="65" y="80" font-size="48" fill="#183044" font-weight="700" text-anchor="start">2/3  注意力计算与第一次残差：输入 → 计算 → 输出</text><text x="65" y="135" font-size="31" fill="#183044" font-weight="400" text-anchor="start">蓝色 GPT-2 ｜ 绿色 Llama 3 ｜ 橙色差异带：明确标出改变了什么</text><text x="65" y="187" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">教学设置：B=2、T=5、D=16、词表 Vocab=100；Q 头=4；GPT-2 KV 头=4，Llama KV 头=2；每头 4 维。</text><text x="65" y="231" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">按推理 eval 模式展开公共前向，不画 Dropout/KV Cache；MLP 宽度 64 vs 48 仅为教学，并非等参数量实验。</text><text x="65" y="275" font-size="27" fill="#526a7b" font-weight="400" text-anchor="start">索引：b 样本，t/i/j 位置（lm_head 的 j 为词表 ID），h 头，d/k 特征；⊙ 逐元素乘，Σ 求和；各模型参数独立。</text><rect x="60" y="320" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="364" font-size="32" fill="#183044" font-weight="700" text-anchor="start">07  计算位置之间的匹配分数</text><text x="1240" y="364" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同公式 · 输入来自各自模型</text><rect x="82" y="404" width="1090" height="292" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="446" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="491" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Q′、K* [2,4,5,4]</text><text x="106" y="532" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：S[b,h,i,j] = Σd Q′[b,h,i,d] K*[b,h,j,d] / 2</text><text x="106" y="573" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">其中：d=0…3；2=√4；i 为查询位置，j 为被读取位置</text><text x="106" y="614" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：S [2,4,5,5]，每个头得到一个 5×5 分数矩阵</text><text x="106" y="655" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：决定每个位置与其他位置的匹配程度</text><rect x="1382" y="404" width="1090" height="292" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="446" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="491" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Q′、K* [2,4,5,4]</text><text x="1406" y="532" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：S[b,h,i,j] = Σd Q′[b,h,i,d] K*[b,h,j,d] / 2</text><text x="1406" y="573" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">其中：d=0…3；2=√4；i 为查询位置，j 为被读取位置</text><text x="1406" y="614" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：S [2,4,5,5]，每个头得到一个 5×5 分数矩阵</text><text x="1406" y="655" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：决定每个位置与其他位置的匹配程度</text><rect x="60" y="753" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="797" font-size="32" fill="#183044" font-weight="700" text-anchor="start">08  遮挡未来位置，并归一化权重</text><text x="1240" y="797" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同 · 因果 mask + softmax</text><rect x="82" y="837" width="1090" height="333" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="879" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="924" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：S [2,4,5,5]；固定因果遮罩 Mask [5,5]</text><text x="106" y="965" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">规则：Mask[i,j]=0（j≤i）；Mask[i,j]=−∞（j&gt;i）</text><text x="106" y="1006" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：S̃ = S + Mask；Mask 广播到每个样本与头</text><text x="106" y="1047" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：A[b,h,i,j] = exp(S̃[b,h,i,j]) / Σk exp(S̃[b,h,i,k])</text><text x="106" y="1088" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：A [2,4,5,5]；每行和为 1，未来位置权重为 0</text><text x="106" y="1129" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">实现：softmax 先减去该行最大值，避免指数溢出</text><rect x="1382" y="837" width="1090" height="333" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="879" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="924" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：S [2,4,5,5]；固定因果遮罩 Mask [5,5]</text><text x="1406" y="965" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">规则：Mask[i,j]=0（j≤i）；Mask[i,j]=−∞（j&gt;i）</text><text x="1406" y="1006" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：S̃ = S + Mask；Mask 广播到每个样本与头</text><text x="1406" y="1047" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：A[b,h,i,j] = exp(S̃[b,h,i,j]) / Σk exp(S̃[b,h,i,k])</text><text x="1406" y="1088" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：A [2,4,5,5]；每行和为 1，未来位置权重为 0</text><text x="1406" y="1129" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">实现：softmax 先减去该行最大值，避免指数溢出</text><rect x="60" y="1227" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="1271" font-size="32" fill="#183044" font-weight="700" text-anchor="start">09  汇总 V，拼接四个头</text><text x="1240" y="1271" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同公式 · V* 的头共享方式不同</text><rect x="82" y="1311" width="1090" height="333" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="1353" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="1398" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：A [2,4,5,5]；V* [2,4,5,4]</text><text x="106" y="1439" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：H[b,h,i,d] = Σj A[b,h,i,j] × V*[b,h,j,d]</text><text x="106" y="1480" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">中间：H [2,4,5,4]；各头按自己的权重汇总 V</text><text x="106" y="1521" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">拼接：交换头/位置轴 → [2,5,4,4] → 合并为 [2,5,16]</text><text x="106" y="1562" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：C [2,5,16]；最后 16 维按头顺序排列</text><text x="106" y="1603" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：把各头读到的上下文信息放进同一个向量</text><rect x="1382" y="1311" width="1090" height="333" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="1353" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="1398" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：A [2,4,5,5]；V* [2,4,5,4]</text><text x="1406" y="1439" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：H[b,h,i,d] = Σj A[b,h,i,j] × V*[b,h,j,d]</text><text x="1406" y="1480" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">中间：H [2,4,5,4]；各头按自己的权重汇总 V</text><text x="1406" y="1521" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">拼接：交换头/位置轴 → [2,5,4,4] → 合并为 [2,5,16]</text><text x="1406" y="1562" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：C [2,5,16]；最后 16 维按头顺序排列</text><text x="1406" y="1603" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：把各头读到的上下文信息放进同一个向量</text><rect x="60" y="1701" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="1745" font-size="32" fill="#183044" font-weight="700" text-anchor="start">10  输出投影：混合不同头的特征</text><text x="1240" y="1745" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 D · 有无 bias</text><rect x="82" y="1785" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="1827" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="1872" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：C [2,5,16]</text><text x="106" y="1913" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：Wₒ [16,16]；bₒ [16]</text><text x="106" y="1954" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：O[b,t,d] = Σk C[b,t,k] Wₒ[k,d] + bₒ[d]</text><text x="106" y="1995" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：O [2,5,16]；作为注意力分支的结果</text><text x="106" y="2036" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：在 16 个拼接特征间做可学习的线性混合</text><rect x="1382" y="1785" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="1827" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="1872" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：C [2,5,16]</text><text x="1406" y="1913" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：Wₒ [16,16]；没有 bₒ</text><text x="1406" y="1954" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：O[b,t,d] = Σk C[b,t,k] Wₒ[k,d]</text><text x="1406" y="1995" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：O [2,5,16]；作为注意力分支的结果</text><text x="1406" y="2036" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：在 16 个拼接特征间做可学习的线性混合</text><rect x="60" y="2134" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="2178" font-size="32" fill="#183044" font-weight="700" text-anchor="start">11  准备第一次残差的两个操作数</text><text x="1240" y="2178" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同 · 取旁路 X 与分支 O</text><rect x="82" y="2218" width="1090" height="251" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="2260" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="2305" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：第 02 步保留的 X，以及第 10 步算出的 O</text><text x="106" y="2346" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">检查：两者都为 [2,5,16]，可以逐元素相加</text><text x="106" y="2387" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：直接把 X、O 交给加法；不做拼接或查表</text><text x="106" y="2428" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：两个同形状张量 X、O；此步不引入参数</text><rect x="1382" y="2218" width="1090" height="251" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="2260" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="2305" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：第 02 步保留的 X，以及第 10 步算出的 O</text><text x="1406" y="2346" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">检查：两者都为 [2,5,16]，可以逐元素相加</text><text x="1406" y="2387" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：直接把 X、O 交给加法；不做拼接或查表</text><text x="1406" y="2428" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：两个同形状张量 X、O；此步不引入参数</text><rect x="60" y="2526" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="2570" font-size="32" fill="#183044" font-weight="700" text-anchor="start">12  第一次残差相加</text><text x="1240" y="2570" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同 · 保留 Block 原输入</text><rect x="82" y="2610" width="1090" height="292" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="2652" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="2697" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：X [2,5,16]；O [2,5,16]</text><text x="106" y="2738" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：R[b,t,d] = X[b,t,d] + O[b,t,d]</text><text x="106" y="2779" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：R [2,5,16]；同时保留 R 供第 15 步使用</text><text x="106" y="2820" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：把注意力分支的结果加到原有表示上</text><text x="106" y="2861" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">注意：加回的是 X，不是归一化后的 U</text><rect x="1382" y="2610" width="1090" height="292" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="2652" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="2697" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：X [2,5,16]；O [2,5,16]</text><text x="1406" y="2738" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：R[b,t,d] = X[b,t,d] + O[b,t,d]</text><text x="1406" y="2779" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：R [2,5,16]；同时保留 R 供第 15 步使用</text><text x="1406" y="2820" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：把注意力分支的结果加到原有表示上</text><text x="1406" y="2861" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">注意：加回的是 X，不是归一化后的 U</text><text x="65" y="2964" font-size="26" fill="#526a7b" font-weight="400" text-anchor="start">读图：同一行横向比较；纵向按编号追踪张量。名称带 W、E、P、γ、β、b 的参数，与本次前向算出的张量要分清。</text><text x="65" y="3008" font-size="25" fill="#526a7b" font-weight="400" text-anchor="start">来源：Raschka GPT→Llama 教程、Meta Llama 3 官方 model.py、本项目 GPT-2 前向；Llama 3 不含 Qwen3 的 QK-Norm。</text></svg>