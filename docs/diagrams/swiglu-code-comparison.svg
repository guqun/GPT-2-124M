<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3020" viewBox="0 0 2400 3020"><title>SwiGLU 与 GELU 代码和数值对照</title><style>text{font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style><rect width="2400" height="3020" fill="#f5f8fb"/><path d="M 610 390 L 610 435" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,435 603.0,419.0 617.0,419.0" fill="#355fc0"/><path d="M 1790 390 L 1790 435" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,435 1783.0,419.0 1797.0,419.0" fill="#087e75"/><path d="M 1200 640 L 1200 685" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,685 1193.0,669.0 1207.0,669.0" fill="#087e75"/><path d="M 610 890 L 610 935" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,935 603.0,919.0 617.0,919.0" fill="#355fc0"/><path d="M 1790 890 L 1790 935" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,935 1783.0,919.0 1797.0,919.0" fill="#087e75"/><path d="M 1790 1285 L 1790 1330" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1330 1783.0,1314.0 1797.0,1314.0" fill="#087e75"/><path d="M 610 1490 L 610 1535" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,1535 603.0,1519.0 617.0,1519.0" fill="#087e75"/><path d="M 1790 1490 L 1790 1535" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1535 1783.0,1519.0 1797.0,1519.0" fill="#087e75"/><path d="M 610 1740 L 610 1770 L 1200 1770 L 1200 1810" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1810 1193.0,1794.0 1207.0,1794.0" fill="#087e75"/><path d="M 1790 1740 L 1790 1770 L 1200 1770" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1770 1216.0,1763.0 1216.0,1777.0" fill="#087e75"/><path d="M 1200 2015 L 1200 2060" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2060 1193.0,2044.0 1207.0,2044.0" fill="#087e75"/><path d="M 1200 2350 L 1200 2395" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2395 1193.0,2379.0 1207.0,2379.0" fill="#087e75"/><path d="M 1200 2640 L 1200 2685" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2685 1193.0,2669.0 1207.0,2669.0" fill="#087e75"/><text x="60" y="80" font-size="48" fill="#172b40" font-weight="700" text-anchor="start">SwiGLU 实践：只替换 MLP，追踪每一步数据</text><text x="60" y="137" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">参照主干已包含 RMSNorm、RoPE、无 bias；红框标出改动。两边随机起步，不加载上轮训练权重。</text><rect x="60" y="185" width="1100" height="205" rx="20" fill="#eef2ff" stroke="#dce4ec" stroke-width="2"/><text x="86" y="230" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">A · train_swiglu_reference.py</text><text x="86" y="277" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">swiglu_training.main(&#x27;gelu&#x27;) → run → build_model</text><text x="86" y="319" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">GELU：128 → 512 → 128；两块权重。</text><text x="86" y="361" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">整模型 6,826,752 参数。</text><rect x="1240" y="185" width="1100" height="205" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="230" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">B · train_swiglu.py</text><text x="1266" y="277" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">swiglu_training.main(&#x27;swiglu&#x27;) → run → build_model</text><text x="1266" y="319" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">SwiGLU：两路 128 → 341，再 341 → 128。</text><text x="1266" y="361" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">整模型 6,826,496 参数；三块权重。</text><rect x="60" y="435" width="2280" height="205" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="480" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">01  参数预算：experiment_settings · L15–22</text><text x="86" y="527" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">GELU：D×4D + 4D×D = 8D²；SwiGLU：D×F + D×F + F×D = 3DF。</text><text x="86" y="569" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">令 3DF≈8D² → F≈8D/3；D=128 → 理想值 341.333…，取最近整数 341。</text><text x="86" y="611" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">每层 131,072 对 130,944：少 128（约 0.098%），近似匹配；不是严格相等，也未做 GPU 倍数对齐。</text><rect x="60" y="685" width="2280" height="205" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="730" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">02  进入 MLP 前，两边经过相同类型的网络环节</text><text x="86" y="777" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">Token ID [2,128] → Embedding → 每层 Norm1 → QKV/RoPE → 注意力/输出投影 → 第一次残差。</text><text x="86" y="819" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">得到主干 R[2,128,128] → z = block.ln_2(R)，仍为 [2,128,128]。</text><text x="86" y="861" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">接下来调用 block.mlp(z)。不同模型的数值可不同；相同的是主干结构与 MLP 以外的参数初值。</text><rect x="60" y="935" width="1100" height="350" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="980" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">03 A · 原 MLP.forward（gpt2_model.py）</text><text x="86" y="1027" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输入 z[2,128,128]；本课所有线性层无 bias。</text><text x="86" y="1069" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">a = c_fc(z) → [2,128,512]</text><text x="86" y="1111" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">g = GELU(a) → [2,128,512]，tanh 近似。</text><text x="86" y="1153" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">out = c_proj(g) → [2,128,128]</text><text x="86" y="1195" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">权重存储：[512,128]、[128,512]。</text><text x="86" y="1237" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">Dropout(p=0) → 返回分支输出。</text><rect x="1240" y="935" width="1100" height="350" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="980" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">03 B · SwiGLU · L25–52</text><text x="1266" y="1027" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">同一个 z，分别交给 gate_proj 和 up_proj。</text><text x="1266" y="1069" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">a = gate_proj(z)；v = up_proj(z)</text><text x="1266" y="1111" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">g = SiLU(a)；u = g * v</text><text x="1266" y="1153" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">out = down_proj(u) → [2,128,128]</text><text x="1266" y="1195" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">权重：[341,128] 两块；[128,341] 一块。</text><text x="1266" y="1237" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">Dropout(p=0) → 返回分支输出。</text><rect x="1246" y="941" width="1088" height="338" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="1330" width="2280" height="160" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1375" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">04  展开 B：每个位置独立算；下面的数组均是激活值，不是权重</text><text x="86" y="1422" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">gate_proj：z[2,128,128] → a[2,128,341]；up_proj：同一个 z → v[2,128,341]。</text><text x="86" y="1464" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">Linear 计算 input @ weight.T；所有位置共用权重，不在不同 Token 之间混合。</text><rect x="60" y="1535" width="1100" height="205" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1580" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">门控支路 · [S1] → [S2]</text><text x="86" y="1627" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">a = gate_proj(z)</text><text x="86" y="1669" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">g = F.silu(a) = a / (1 + exp(−a))</text><text x="86" y="1711" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">g[2,128,341]；可为负、可大于 1。</text><rect x="66" y="1541" width="1088" height="193" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="1240" y="1535" width="1100" height="205" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="1580" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">内容支路 · [S1]</text><text x="1266" y="1627" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">v = up_proj(z)</text><text x="1266" y="1669" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">v[2,128,341]；使用独立的可训练矩阵。</text><text x="1266" y="1711" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">这里的 v 是 MLP 内容，不是注意力 V。</text><rect x="1246" y="1541" width="1088" height="193" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="1810" width="2280" height="205" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1855" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">05  [S3] 逐元素乘 → [S4] 输出投影 → 回到 Block</text><text x="86" y="1902" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">u[b,t,j] = g[b,t,j] × v[b,t,j]；u[2,128,341]，这个 * 不是矩阵乘法。</text><text x="86" y="1944" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">out = down_proj(u) = u @ down_proj.weight.T → [2,128,128]；MLP 返回 out。</text><text x="86" y="1986" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">Block.forward 随后计算 R + out → [2,128,128]；这里加的是保留的 R，不是归一化后的 z。</text><rect x="66" y="1816" width="2268" height="193" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="2060" width="2280" height="290" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="86" y="2105" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">06  具体数值：另取一个位置 D=2、F=2；教学选值，不用于参数量对照</text><text x="86" y="2152" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输入 z=[1,2]。数学右乘矩阵 Wg=[[1,0],[0,−1]]；Wu=[[2,0],[0,3]]；Wd=[[1,1],[1,−1]]。</text><text x="86" y="2194" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">a=zWg=[1,−2]；v=zWu=[2,6]。PyTorch .weight 存储上述矩阵的转置。</text><text x="86" y="2236" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">g=[1/(1+exp(−1)), −2/(1+exp(2))] ≈ [0.731059, -0.238406]。</text><text x="86" y="2278" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">u=g*v=[0.731059×2, -0.238406×6] ≈ [1.462117, -1.430435]。</text><text x="86" y="2320" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">out=uWd=[u₀+u₁, u₀−u₁] ≈ [0.031682, 2.892552]；分支输出依旧是 2 维。</text><rect x="60" y="2395" width="2280" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="2440" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">07  回到训练 · swiglu_training.py：train_update · L86–107</text><text x="86" y="2487" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">固定配置/原文/90%–10% 切分 → 构造模型并完成替换 → 创建 AdamW → 验证初始 loss。</text><text x="86" y="2529" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">取 x/y[2,128] → 完整前向/交叉熵 → (loss/4).backward()；四个微批的梯度累加到各参数 .grad。</text><text x="86" y="2571" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">乘法反向同时流向 gate/up 两路；三块权重均得到梯度 → 裁剪 → AdamW 更新一次 → 清梯度。</text><text x="86" y="2613" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">100 次更新，每 20 次及末次固定窗口验证；保存独立 report/metrics/checkpoint。旧代码和结果保留。</text><rect x="60" y="2685" width="2280" height="205" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="2730" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">08  compare_swiglu_runs.py：相同协议后再比较</text><text x="86" y="2777" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">核对数据、配置、MLP 外共同初始权重、设备、源码和实际微批次顺序。MLP 本身不声称初值相同。</text><text x="86" y="2819" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">A/B 分别顺序实跑；比较同窗口验证 loss、参数量和 Token/s。CPU 速度不代表 GPU 速度。</text><text x="86" y="2861" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">能力：学会接入门控 MLP 与控制容量；边界：单种子短跑不保证改善，不是完整 Llama 模型。</text><text x="60" y="2960" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">来源：GLU Variants Improve Transformer；Meta Llama 3 FeedForward。数值例子和本机配置是教学改编。</text></svg>