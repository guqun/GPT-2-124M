<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><rect width="1100" height="640" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#172b40"><text x="55" y="57" font-size="30" font-weight="bold">图 1 · 验证 loss：越低越好</text><text x="55" y="94" font-size="18" fill="#a04b16">读图示意｜曲线为人工示意，只有基线数值取自原课配套代码</text><rect x="55" y="120" width="990" height="430" rx="15" fill="white"/><path d="M110 150V490H995" stroke="#94a3b8" fill="none" stroke-width="2"/><text x="110" y="525" font-size="18">训练初期</text><text x="850" y="525" font-size="18">训练推进 →</text><text x="130" y="157" font-size="18">验证 loss ↓</text><path d="M110 335H995" stroke="#dc4444" stroke-width="2" stroke-dasharray="9 7"/><text x="570" y="321" fill="#c83232" font-size="20">GPT-2（124M）验证 loss = 3.2924</text><path d="M125 185 C170 230 210 285 290 308 S430 347 520 371 S760 405 980 418" fill="none" stroke="#e78a25" stroke-width="5"/><text x="650" y="455" fill="#b86415" font-size="20">训练中模型的验证 loss（示意）</text><text x="140" y="250" font-size="18">逐渐降低</text><text x="55" y="587" font-size="19">橙线低于红线：在同一验证集、同一计算口径下，平均预测 loss 更低。</text><text x="55" y="619" font-size="16" fill="#64748b">曲线仅说明读图方法；不代表原课或本项目的实测结果。横轴无具体步数。</text></g></svg>