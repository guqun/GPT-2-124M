<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="4170" viewBox="0 0 2400 4170"><title>两份代码的结构与训练对照流程</title><style>text{font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style><rect width="2400" height="4170" fill="#f5f8fb"/><path d="M 610 345 L 610 385 L 1200 385 L 1200 425" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,425 1193.0,409.0 1207.0,409.0" fill="#355fc0"/><path d="M 1790 345 L 1790 385 L 1200 385" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,385 1216.0,378.0 1216.0,392.0" fill="#087e75"/><path d="M 1200 730 L 1200 780" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,780 1193.0,764.0 1207.0,764.0" fill="#087e75"/><path d="M 1200 995 L 1200 1040" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1040 1193.0,1024.0 1207.0,1024.0" fill="#087e75"/><path d="M 610 1465 L 610 1510" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,1510 603.0,1494.0 617.0,1494.0" fill="#355fc0"/><path d="M 1790 1465 L 1790 1510" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1510 1783.0,1494.0 1797.0,1494.0" fill="#087e75"/><path d="M 1200 1680 L 1200 1730" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1730 1193.0,1714.0 1207.0,1714.0" fill="#087e75"/><path d="M 1200 1940 L 1200 1990" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1990 1193.0,1974.0 1207.0,1974.0" fill="#087e75"/><path d="M 1200 2255 L 1200 2305" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2305 1193.0,2289.0 1207.0,2289.0" fill="#087e75"/><path d="M 1200 2560 L 1200 2610" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2610 1193.0,2594.0 1207.0,2594.0" fill="#087e75"/><path d="M 1200 2820 L 1200 2870" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2870 1193.0,2854.0 1207.0,2854.0" fill="#087e75"/><path d="M 1200 3080 L 1200 3130" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,3130 1193.0,3114.0 1207.0,3114.0" fill="#087e75"/><path d="M 2340 3230 L 2375 3230 L 2375 2022 L 2340 2022" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="2340,2022 2356.0,2015.0 2356.0,2029.0" fill="#355fc0"/><path d="M 1200 3340 L 1200 3390" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,3390 1193.0,3374.0 1207.0,3374.0" fill="#087e75"/><path d="M 610 3695 L 610 3730 L 1200 3730 L 1200 3770" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,3770 1193.0,3754.0 1207.0,3754.0" fill="#355fc0"/><path d="M 1790 3695 L 1790 3730 L 1200 3730" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,3730 1216.0,3723.0 1216.0,3737.0" fill="#087e75"/><text x="60" y="82" font-size="47" fill="#172b40" font-weight="700" text-anchor="start">两份可运行代码：GPT-2 与 RMSNorm / 无 bias 对照</text><text x="60" y="140" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">每次只运行一边；共同训练循环、数据顺序与参数初值相同。红框标出结构变化，后续分别保存结果。</text><rect x="60" y="190" width="1100" height="155" rx="20" fill="#eef2ff" stroke="#dce4ec" stroke-width="2"/><text x="88" y="236" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">A · train_baseline_gpt2.py</text><text x="88" y="284" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">main(&#x27;gpt2&#x27;) → 原始 GPT-2 风格小模型</text><text x="88" y="326" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">LayerNorm + 线性 bias；6,862,464 个参数。</text><rect x="1240" y="190" width="1100" height="155" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="1268" y="236" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">B · train_baseline_rmsnorm.py</text><text x="1268" y="284" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">main(&#x27;rmsnorm_no_bias&#x27;) → 两项改动的组合</text><text x="1268" y="326" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">RMSNorm + 无线性 bias；6,859,520 个参数。</text><rect x="60" y="425" width="2280" height="64" rx="10" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="84" y="469" font-size="32" fill="#172b40" font-weight="700" text-anchor="start">01  共用 architecture_training.py · main · L219–238 → run · L119–216</text><rect x="60" y="520" width="2280" height="210" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="566" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">读取 local 配置，固定本次协议</text><text x="88" y="614" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输入：architecture-baseline-local.json + 命令行参数；默认 100 次更新、seed=42、CPU/FP32、4 线程。</text><text x="88" y="656" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">模型：2 层 / 128 维 / 4 头；词表 50,257；B=2、T=128、K=4；无 Dropout、无 compile、无 DDP。</text><text x="88" y="698" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输出：spec、device、独立输出目录。共同源代码/数据/初值指纹写入报告；已有结果不覆盖。</text><rect x="60" y="780" width="2280" height="215" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="826" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">02  复用 prepare_local_data → split_tokens → first_batch</text><text x="88" y="874" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">CPU：原文校验 → GPT-2 分词 → 338,025 个整数 ID → train[0:304222] / val[304222:338025]。</text><text x="88" y="916" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">取 B×T+1=257 个 ID；x=buf[:-1].view(2,128)，y=buf[1:].view(2,128)。x/y 为 int64。</text><text x="88" y="958" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输出：训练列表、验证列表。训练游标按 256 前进；验证始终从自身开头读 8 批，共 2,048 个预测位置。</text><rect x="60" y="1040" width="2280" height="64" rx="10" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="84" y="1084" font-size="32" fill="#172b40" font-weight="700" text-anchor="start">03  architecture_variants.py · build_model · L57–66：先相同初始化，再分支</text><rect x="60" y="1135" width="1100" height="330" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="1181" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">A：保留 GPT，不替换模块</text><text x="88" y="1229" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输入：相同 seed=42、相同 GPTConfig。</text><text x="88" y="1271" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每个 Block：LN1 → Attention → 残差</text><text x="88" y="1313" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">                   LN2 → GELU MLP → 残差</text><text x="88" y="1355" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">所有 Block 后还有一个最终 LayerNorm。</text><text x="88" y="1397" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">LN(x)=γ⊙(x−mean(x))/√(var(x)+ε)+β</text><text x="88" y="1439" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">线性层：y=xWᵀ+b；lm_head 原本就无 bias。</text><rect x="1240" y="1135" width="1100" height="330" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="1268" y="1181" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">B：replace_norm_and_bias（创建优化器前）</text><text x="1268" y="1229" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输入：与 A 完全相同的初始 GPT 参数。</text><text x="1268" y="1271" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">替换 5 处 LN → RMSNorm；保留 gamma 初值 1。</text><text x="1268" y="1313" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">RMS(x)=γ⊙x/√(mean(x²)+ε)，没有 beta。</text><text x="1268" y="1355" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">移除注意力/MLP 的 8 组线性 bias：y=xWᵀ。</text><text x="1268" y="1397" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输出：共同权重原值保留的改动模型。</text><text x="1268" y="1439" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">仍是绝对位置表、MHA、GELU、共享 lm_head。</text><rect x="1252" y="1147" width="1076" height="306" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="1510" width="2280" height="170" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="1556" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">归一化手算对照：x=[1,2,3,4]，γ=1、β=0；仅此例忽略 ε</text><text x="88" y="1604" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">A：均值=2.5，方差=1.25 → (x−2.5)/√1.25 → [−1.3416,−0.4472,0.4472,1.3416]。</text><text x="88" y="1646" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">B：平方均值=(1+4+9+16)/4=7.5 → x/√7.5 → [0.3651,0.7303,1.0954,1.4606]。</text><rect x="60" y="1730" width="2280" height="210" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="1776" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">04  创建各自 AdamW → 初始验证 · evaluate · L61–81</text><text x="88" y="1824" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">模型 .to(device)；默认全部 CPU。选 CUDA/MPS 时，参数在设备，ID 列表仍在 CPU。</text><text x="88" y="1866" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">AdamW：二维参数 weight decay=0.1，一维=0；β=(0.9,0.95)，ε=1e−8；参数共享只注册一次。</text><text x="88" y="1908" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">固定 8 批 val → eval + no_grad → 总交叉熵 / 2,048 → val_loss；恢复原模式，不改训练游标。</text><rect x="60" y="1990" width="2280" height="64" rx="10" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="84" y="2034" font-size="32" fill="#172b40" font-weight="700" text-anchor="start">05  外层循环 update=1…100：设置学习率 → 同步设备 → 开始计时</text><rect x="60" y="2085" width="2280" height="170" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="2131" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">学习率预热与计时预热是两件事 · learning_rate · L45–50</text><text x="88" y="2179" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">学习率：第 1…10 次为 0.0006×update/10；此后余弦降至第 100 次的 0.00006。</text><text x="88" y="2221" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">计时：前 2 次正常训练，但不计入稳定吞吐；这 2 次仍消耗训练数据并更新参数。</text><rect x="60" y="2305" width="2280" height="255" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="88" y="2351" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">06  train_update · L84–105：先 zero_grad，再循环 4 个微批次</text><text x="88" y="2399" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">next_batch() → CPU x/y [2,128] → .to(device) → model(x) → logits [2,128,50257]。</text><text x="88" y="2441" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">PyTorch cross_entropy → 本微批 256 个位置的平均损失 Lm（标量）。</text><text x="88" y="2483" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">(Lm/4).backward() → 梯度加入同一套参数的 .grad；4 轮内参数 θ 不变。</text><text x="88" y="2525" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">第 1 次更新读取 train 区间：[0,257)、[256,513)、[512,769)、[768,1025)。</text><rect x="60" y="2610" width="2280" height="210" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="2656" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">展开累计：gₘ=∂Lₘ/∂θ；每个参数都各自累加</text><text x="88" y="2704" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">.grad：g₀/4 → (g₀+g₁)/4 → (g₀+g₁+g₂)/4 → (g₀+g₁+g₂+g₃)/4。</text><text x="88" y="2746" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">单参数示例 g=[2,−1,3,0]：加进 [0.5,−0.25,0.75,0] → 最终 .grad=1。（教学值）</text><text x="88" y="2788" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">四轮共 1,024 个预测位置；loss 除以 4，不是把四次参数更新合并。</text><rect x="60" y="2870" width="2280" height="210" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="88" y="2916" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">07  裁剪 → 更新一次参数 → 清梯度 → 同步设备并结束计时</text><text x="88" y="2964" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">clip_grad_norm_(全部参数,1.0)：按全局范数统一缩放累计梯度，再 optimizer.step()。</text><text x="88" y="3006" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">AdamW 更新 m/v 并修正初始偏差：θ←(1−lr×λ)θ−lr×m̂/(√v̂+ε)；zero_grad 不清 m/v。</text><text x="88" y="3048" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输出：新参数、训练 loss、梯度范数、取批起点、耗时；本步 Token/s=1,024/秒数。</text><rect x="60" y="3130" width="2280" height="210" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="3176" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">08  每 20 次与最后一次：固定窗口验证；尚未到 100 次则回到 05</text><text x="88" y="3224" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">验证不在训练计时区间内，不 backward、不 step，也不根据 val_loss 改学习率。</text><text x="88" y="3266" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">下一次更新继续从 train 游标取数；不足一批时跳过短尾、回到 train 开头，不跨入 val。</text><text x="88" y="3308" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">默认验证记录：update=0、20、40、60、80、100。metrics.jsonl 逐步写入，便于观察。</text><rect x="60" y="3390" width="2280" height="64" rx="10" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="84" y="3434" font-size="32" fill="#172b40" font-weight="700" text-anchor="start">09  完成后各自保存 → compare_architecture_runs.py 核对协议并比较</text><rect x="60" y="3485" width="1100" height="210" rx="20" fill="#eef2ff" stroke="#dce4ec" stroke-width="2"/><text x="88" y="3531" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">A：.cache/architecture-comparison/gpt2/</text><text x="88" y="3579" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">report.json：配置、loss、时间、初值/数据指纹。</text><text x="88" y="3621" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">metrics.jsonl：每次训练与验证记录。</text><text x="88" y="3663" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">checkpoint.pt：模型/优化器/配置/更新次数。</text><rect x="1240" y="3485" width="1100" height="210" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="1268" y="3531" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">B：同父目录 / rmsnorm_no_bias/</text><text x="1268" y="3579" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">同样保存三份文件，与 A 分开。</text><text x="1268" y="3621" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">默认 100 次更新 = 102,400 个训练预测位置。</text><text x="1268" y="3663" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">检查点可加载；本入口尚无断点续训选项。</text><rect x="60" y="3770" width="2280" height="210" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="88" y="3816" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">比较条件一致才输出对照表 · compare · L8–23</text><text x="88" y="3864" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">核对配置/数据/共同权重初值/源码/设备/实际取批顺序 → 不一致就停止比较。</text><text x="88" y="3906" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">loss：比较同一验证窗口的最终值；吞吐：测量步总 Token / 测量步总秒数，排除验证与保存。</text><text x="88" y="3948" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">这是 RMSNorm + 去 bias 的组合实验；需后续单因素、多种子实验，才能拆分贡献与判断稳健性。</text><text x="60" y="4050" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">范围：本机小模型、从随机参数开始；不是加载 GPT-2 预训练权重，不等同完整 Llama，也不保证 B 更快。</text><text x="60" y="4105" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">公式与协议由本项目组织；矩阵计算、自动求导和 AdamW 由 PyTorch 执行。图中行号由当前源码提取。</text></svg>