<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3310" viewBox="0 0 2400 3310"><title>RoPE 代码与数值流转</title><style>text{font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style><rect width="2400" height="3310" fill="#f5f8fb"/><path d="M 610 385 L 610 435" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,435 603.0,419.0 617.0,419.0" fill="#355fc0"/><path d="M 1790 385 L 1790 435" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,435 1783.0,419.0 1797.0,419.0" fill="#087e75"/><path d="M 610 680 L 610 730" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,730 603.0,714.0 617.0,714.0" fill="#355fc0"/><path d="M 1790 680 L 1790 730" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,730 1783.0,714.0 1797.0,714.0" fill="#087e75"/><path d="M 610 930 L 610 980" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,980 603.0,964.0 617.0,964.0" fill="#355fc0"/><path d="M 1790 930 L 1790 980" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,980 1783.0,964.0 1797.0,964.0" fill="#087e75"/><path d="M 1790 1225 L 1790 1275" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1275 1783.0,1259.0 1797.0,1259.0" fill="#087e75"/><path d="M 1200 1520 L 1200 1570" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,1570 1193.0,1554.0 1207.0,1554.0" fill="#087e75"/><path d="M 610 1770 L 610 1820" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,1820 603.0,1804.0 617.0,1804.0" fill="#087e75"/><path d="M 1790 1770 L 1790 1820" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1820 1783.0,1804.0 1797.0,1804.0" fill="#087e75"/><path d="M 610 2065 L 610 2100 L 1200 2100 L 1200 2140" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2140 1193.0,2124.0 1207.0,2124.0" fill="#087e75"/><path d="M 1790 2065 L 1790 2100 L 1200 2100" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2100 1216.0,2093.0 1216.0,2107.0" fill="#087e75"/><path d="M 1200 2385 L 1200 2435" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2435 1193.0,2419.0 1207.0,2419.0" fill="#087e75"/><path d="M 1200 2635 L 1200 2685" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2685 1193.0,2669.0 1207.0,2669.0" fill="#087e75"/><path d="M 1200 2930 L 1200 2980" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200,2980 1193.0,2964.0 1207.0,2964.0" fill="#087e75"/><text x="60" y="80" font-size="48" fill="#172b40" font-weight="700" text-anchor="start">RoPE 接入代码：位置表 → 每层 Q/K 旋转</text><text x="60" y="138" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">参照不是原始 GPT-2：两边已经都有 RMSNorm / 无 bias。本节只比较位置方案；红框标出改动。</text><rect x="60" y="190" width="1100" height="195" rx="20" fill="#eef2ff" stroke="#dce4ec" stroke-width="2"/><text x="86" y="235" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">A · train_rope_reference.py</text><text x="86" y="282" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">rope_training.main(&#x27;absolute&#x27;)</text><text x="86" y="324" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">RMSNorm/no-bias + 学习式绝对位置表。</text><text x="86" y="366" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">随机参数起点；共 6,859,520 个参数。</text><rect x="1240" y="190" width="1100" height="195" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="235" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">B · train_rope.py</text><text x="1266" y="282" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">rope_training.main(&#x27;rope&#x27;)</text><text x="1266" y="324" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">相同结构 + RoPE；移除 256×128 位置表。</text><text x="1266" y="366" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">共同权重初值相同；共 6,826,752 个参数。</text><rect x="60" y="435" width="1100" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="480" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">01  输入端：Token + Position</text><text x="86" y="527" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输入：Token ID [B,T]，位置编号 0…T−1。</text><text x="86" y="569" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">参数：wte[50257,128]、wpe[256,128]。</text><text x="86" y="611" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">计算：x = wte(ids) + wpe(positions)。</text><text x="86" y="653" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输出：x[B,T,128]；位置已混入向量。</text><rect x="1240" y="435" width="1100" height="245" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="480" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">01  输入端：RotaryGPT · L79–102</text><text x="1266" y="527" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输入：相同形状的 Token ID [B,T]。</text><text x="1266" y="569" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">构造时 del transformer[&#x27;wpe&#x27;]，不留闲置参数。</text><text x="1266" y="611" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">计算：x = wte(ids)，没有输入位置向量相加。</text><text x="1266" y="653" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">输出：x[B,T,128]；位置稍后进入每层 Q/K。</text><rect x="1250" y="445" width="1080" height="225" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="730" width="2280" height="200" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="775" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">02  每个 Block：RMSNorm → QKV 投影 → 拆头（两边共同）</text><text x="86" y="822" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输入：[B,T,128] → c_attn 权重 [384,128] → split：Q、K、V 各 [B,T,128]。</text><text x="86" y="864" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">reshape + transpose → Q、K、V 各 [B,4,T,32]。每头 32 维；旋转前的 q/k 已经是数据激活值。</text><text x="86" y="906" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">共同权重初值相同，不代表 q/k 数值相同：A 的输入带位置向量，B 的输入不带。</text><rect x="60" y="980" width="1100" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1025" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">03  A：直接使用投影后的 Q/K</text><text x="86" y="1072" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">Q′=Q，K′=K，V 保留。</text><text x="86" y="1114" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">没有本节新增的三角函数或旋转运算。</text><text x="86" y="1156" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">形状：Q/K/V 都是 [B,4,T,32]。</text><text x="86" y="1198" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">注意力继续计算 QKᵀ/√32。</text><rect x="1240" y="980" width="1100" height="245" rx="20" fill="#fff5e7" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="1025" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">03  B：RotaryAttention · L52–76</text><text x="1266" y="1072" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">q,k = self.rope(q,k)，V 不旋转。</text><text x="1266" y="1114" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">32 维拆成 16 对，相邻两维一组。</text><text x="1266" y="1156" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">每对按位置 t 旋转，Q/K 形状保持不变。</text><text x="1266" y="1198" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">每层重新投影，再旋转本层的新 Q/K。</text><rect x="1250" y="990" width="1080" height="225" rx="16" fill="none" stroke="#cf4141" stroke-width="2"/><rect x="60" y="1275" width="2280" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1320" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">展开 B：RotaryEmbedding · L28–49 → apply_rotary · L18–25</text><text x="86" y="1367" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">参数：没有新增可训练参数；theta=10000 为固定教学配置。r=0…15，d=32。</text><text x="86" y="1409" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">角度 φ[t,r]=t×theta^(−2r/d) → cos/sin 缓存 [256,16] → 本批取前 T 行 [T,16]。</text><text x="86" y="1451" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">缓存是 buffer，随模型移动设备；不同 batch/头广播共用，位置按每条序列 0…T−1 编号。</text><text x="86" y="1493" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">拆出 even=x[...,0::2]、odd=x[...,1::2] → 两路旋转乘加 → stack/flatten 恢复原维序。</text><rect x="60" y="1570" width="2280" height="200" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1615" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">四维手算例子：仅用于看数据流；不是本机 32 维头的实测激活</text><text x="86" y="1662" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输入：位置 1 的 q=[1,2,3,4]；位置 0、1 的原始 k 都选为 [2,1,0,1]，便于隔离位置效果。</text><text x="86" y="1704" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">d=4、theta=10000 → 两对频率 [1,0.01] → 位置 1 的角度 [1,0.01] 弧度。</text><text x="86" y="1746" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">even=[1,3]，odd=[2,4]；cos≈[0.540302,0.999950]，sin≈[0.841471,0.010000]。</text><rect x="60" y="1820" width="1100" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="1865" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">第一对 (1,2)：旋转 1 弧度</text><text x="86" y="1912" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新偶维 = 1×0.540302 − 2×0.841471</text><text x="86" y="1954" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">            ≈ -1.142640</text><text x="86" y="1996" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新奇维 = 1×0.841471 + 2×0.540302</text><text x="86" y="2038" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">            ≈ 1.922076</text><rect x="1240" y="1820" width="1100" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="1266" y="1865" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">第二对 (3,4)：旋转 0.01 弧度</text><text x="1266" y="1912" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新偶维 = 3×0.999950 − 4×0.010000</text><text x="1266" y="1954" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">            ≈ 2.959851</text><text x="1266" y="1996" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新奇维 = 3×0.010000 + 4×0.999950</text><text x="1266" y="2038" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">            ≈ 4.029800</text><rect x="60" y="2140" width="2280" height="245" rx="20" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="86" y="2185" font-size="32" fill="#087e75" font-weight="700" text-anchor="start">旋转输出 → 送入注意力分数计算</text><text x="86" y="2232" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q′(位置1) ≈ [-1.142640, 1.922076, 2.959851, 4.029800]。</text><text x="86" y="2274" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k′(位置0)=[2,1,0,1]；k′(位置1)≈[0.239134, 2.223244, -0.010000, 0.999950]。</text><text x="86" y="2316" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q′₁·k′₀≈3.666596；q′₁·k′₁=8.000000。相同原始 k，因为位置不同，匹配分数不同。</text><text x="86" y="2358" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每个二维旋转保持向量长度；同位置同时旋转 q/k 保持原点积。V 始终走原来的支路。</text><rect x="60" y="2435" width="2280" height="200" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="2480" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">04  回到共同主干：缩放 → 因果遮罩 → softmax → AV</text><text x="86" y="2527" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">实训 d=32：S=Q′K′ᵀ/√32 → 遮挡未来位置 → A=softmax(S) [B,4,T,T]。</text><text x="86" y="2569" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">H=A@V [B,4,T,32] → 拼接 [B,T,128] → 输出投影 → 第一次残差 → RMSNorm/MLP/第二次残差。</text><text x="86" y="2611" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">继续后续 Block → 最终 RMSNorm → 共享 lm_head → logits [B,T,50257]。</text><rect x="60" y="2685" width="2280" height="245" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="2730" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">05  rope_training.py：两边独立运行同一套训练协议</text><text x="86" y="2777" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">固定原文与 train/val → 每微批 x/y [2,128] → 前向/CE → (loss/4).backward()，累积四次。</text><text x="86" y="2819" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">累计梯度 → 全局范数裁剪 → AdamW 更新一次 → 清梯度；默认 100 次，共 102,400 个预测位置。</text><text x="86" y="2861" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">每 20 次及末次固定窗口验证；计时排除验证/保存；初始两次更新只排除出吞吐统计。</text><text x="86" y="2903" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">输出 .cache/rope-comparison/{absolute,rope}/ 下 report、metrics、checkpoint；旧实验文件保留。</text><rect x="60" y="2980" width="2280" height="155" rx="20" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="86" y="3025" font-size="32" fill="#355fc0" font-weight="700" text-anchor="start">06  compare_rope_runs.py：比较之前先核对协议</text><text x="86" y="3072" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">共同初始参数指纹排除 A 独有的 wpe；其余配置、数据、设备、源码和实际取批顺序必须匹配。</text><text x="86" y="3114" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">比较同窗口验证 loss 与吞吐；不保证 RoPE 更优，也不能据此推断长上下文效果。</text><text x="60" y="3200" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">本课最大长度仍为 256、训练长度 128；不含 KV cache 偏移、长上下文外推或 YaRN。theta 不等于模型参数。</text><text x="60" y="3250" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">红框为代码改动；四维数值是教学输入。旋转公式与复数实现、因果性及反向传播均有行为测试。</text></svg>