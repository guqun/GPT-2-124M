<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3370" viewBox="0 0 2400 3370"><title>GPT-2 与 Llama 3 位置编码计算流程</title><style>text {font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style><rect width="2400" height="3370" fill="#f5f8fb"/><path d="M 610 610 L 610 663" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,663 603.0,647.0 617.0,647.0" fill="#355fc0"/><path d="M 610 949 L 610 1004" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,1004 603.0,988.0 617.0,988.0" fill="#355fc0"/><path d="M 1790 610 L 1790 663" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,663 1783.0,647.0 1797.0,647.0" fill="#087e75"/><path d="M 1790 949 L 1790 1004" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1004 1783.0,988.0 1797.0,988.0" fill="#087e75"/><path d="M 610 1669 L 610 1720" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,1720 603.0,1704.0 617.0,1704.0" fill="#355fc0"/><path d="M 610 1970 L 610 2022" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,2022 603.0,2006.0 617.0,2006.0" fill="#355fc0"/><path d="M 610 2397 L 610 2446" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,2446 603.0,2430.0 617.0,2430.0" fill="#355fc0"/><path d="M 610 2654 L 610 2703" stroke="#355fc0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,2703 603.0,2687.0 617.0,2687.0" fill="#355fc0"/><path d="M 1790 1669 L 1790 1720" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1720 1783.0,1704.0 1797.0,1704.0" fill="#087e75"/><path d="M 1790 1970 L 1790 2022" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,2022 1783.0,2006.0 1797.0,2006.0" fill="#087e75"/><path d="M 1790 2397 L 1790 2446" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,2446 1783.0,2430.0 1797.0,2430.0" fill="#087e75"/><path d="M 1790 2654 L 1790 2703" stroke="#087e75" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,2703 1783.0,2687.0 1797.0,2687.0" fill="#087e75"/><text x="60" y="78" font-size="47" fill="#172b40" font-weight="700" text-anchor="start">位置信息在哪里进入计算？GPT-2 与 Llama 3 RoPE</text><text x="60" y="132" font-size="29" fill="#586c7d" font-weight="400" text-anchor="start">蓝色：入口相加的位置向量    绿色：每层注意力中的旋转    橙色：差异、位置输入与配置</text><text x="60" y="181" font-size="27" fill="#586c7d" font-weight="400" text-anchor="start">教学形状：B=1，T=2，模型维度 D=4；本图只取一个 4 维头，不展开多头共享与 KV Cache。</text><rect x="60" y="214" width="2280" height="65" rx="20" fill="#fff3df" stroke="none" stroke-width="2"/><text x="83" y="256" font-size="29" fill="#98601f" font-weight="650" text-anchor="start">可训练参数 ≠ 本次输入计算出的 Q/K ≠ 位置编号 t ≠ 固定配置 θ；下面分别标注。</text><text x="76" y="331" font-size="37" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2：学习位置表 P</text><rect x="60" y="357" width="1100" height="253" rx="17" fill="#edf2ff" stroke="#dce4ec" stroke-width="2"/><text x="84" y="400" font-size="31" fill="#355fc0" font-weight="650" text-anchor="start">01 入口：Token ID 先变成向量</text><text x="84" y="445" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输入：ID 序列 I=[17,42]，形状 [1,2]；位置 t=[0,1]</text><text x="84" y="485" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">可训练参数：Token 表 E [词表大小,4]；位置表 P [Cmax,4]</text><text x="84" y="525" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">计算：X[0,t,:] = E[I[t]] + P[t]</text><text x="84" y="565" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出：X [1,2,4]；位置信息已在入口加入</text><rect x="60" y="663" width="1100" height="286" rx="17" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="84" y="706" font-size="31" fill="#355fc0" font-weight="650" text-anchor="start">02 每层 Block：归一化 → QKV 投影 → 拆头</text><text x="84" y="751" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输入：当前层的 X；首层来自入口，后续层来自前一层</text><text x="84" y="791" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">计算：U = LayerNorm(X)</text><text x="84" y="831" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">计算：Q=U Wq + bq；K=U Wk + bk；V=U Wv + bv</text><text x="84" y="871" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">参数：Wq/Wk/Wv 各 [4,4]；γ、β 及各路 bias 可训练</text><text x="84" y="911" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出：Q、K、V 各 [1,1,2,4] = [B,头数,T,每头维]</text><rect x="60" y="1004" width="1100" height="251" rx="17" fill="#fff3df" stroke="#dce4ec" stroke-width="2"/><text x="84" y="1047" font-size="31" fill="#355fc0" font-weight="650" text-anchor="start">03 差异发生处：是否旋转 Q/K</text><text x="84" y="1092" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输入：已经含有上游位置影响的 Q、K、V</text><text x="84" y="1132" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">计算：Q′=Q；K′=K；此处不做位置旋转</text><text x="84" y="1172" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">位置参数 P 已在入口使用，此处不再查 P</text><text x="84" y="1212" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出：Q′、K′、V 形状均不变；交给 Q′K′ᵀ</text><text x="1256" y="331" font-size="37" fill="#087e75" font-weight="700" text-anchor="start">Llama 3：由位置计算旋转</text><rect x="1240" y="357" width="1100" height="253" rx="17" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="1264" y="400" font-size="31" fill="#087e75" font-weight="650" text-anchor="start">01 入口：Token ID 先变成向量</text><text x="1264" y="445" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输入：ID 序列 I=[17,42]，形状 [1,2]；位置 t=[0,1]</text><text x="1264" y="485" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">可训练参数：Token 表 E [词表大小,4]；没有位置表 P</text><text x="1264" y="525" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">计算：X[0,t,:] = E[I[t]]</text><text x="1264" y="565" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出：X [1,2,4]；位置 t 留给每层 RoPE</text><rect x="1240" y="663" width="1100" height="286" rx="17" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="1264" y="706" font-size="31" fill="#087e75" font-weight="650" text-anchor="start">02 每层 Block：归一化 → QKV 投影 → 拆头</text><text x="1264" y="751" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输入：当前层的 X；首层来自入口，后续层来自前一层</text><text x="1264" y="791" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">计算：U = RMSNorm(X)</text><text x="1264" y="831" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">计算：Q=U Wq；K=U Wk；V=U Wv</text><text x="1264" y="871" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">参数：Wq/Wk/Wv 各 [4,4]；γ 可训练；投影无 bias</text><text x="1264" y="911" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出：Q、K、V 各 [1,1,2,4] = [B,头数,T,每头维]</text><rect x="1240" y="1004" width="1100" height="251" rx="17" fill="#fff3df" stroke="#dce4ec" stroke-width="2"/><text x="1264" y="1047" font-size="31" fill="#087e75" font-weight="650" text-anchor="start">03 差异发生处：是否旋转 Q/K</text><text x="1264" y="1092" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输入：Q、K，以及各自 Token 的位置 t；V 旁路保留</text><text x="1264" y="1132" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">固定配置：θ=500000；每头维度 dₕ=4；无新增可训练参数</text><text x="1264" y="1172" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">计算：每头相邻两维配对，按 t 算角度，再旋转每一对</text><text x="1264" y="1212" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出：Q′、K′ 形状不变；V 不旋转；交给 Q′K′ᵀ</text><rect x="60" y="1305" width="2280" height="112" rx="20" fill="#fff3df" stroke="none" stroke-width="2"/><text x="84" y="1347" font-size="29" fill="#98601f" font-weight="650" text-anchor="start">下面只隔离比较“旋转这一步”：人为固定同一组 Q/K，不是两模型从同一文本得到的完整输出。</text><text x="84" y="1390" font-size="27" fill="#98601f" font-weight="400" text-anchor="start">查询位置 i=1（第 2 个 Token）读取位置 j=0（第 1 个 Token）；所有向量数值为教学选值。</text><rect x="60" y="1464" width="1100" height="205" rx="17" fill="#edf2ff" stroke="#dce4ec" stroke-width="2"/><text x="84" y="1507" font-size="31" fill="#355fc0" font-weight="650" text-anchor="start">04 数值输入：一个查询向量与一个键向量</text><text x="84" y="1552" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">位置 1 的 q = [1,2,3,4]；位置 0 的 k = [2,1,0,1]</text><text x="84" y="1592" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">配对：q 的 (1,2)、(3,4)；k 的 (2,1)、(0,1)</text><text x="84" y="1632" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">配对在每个头内部进行，不是再拆出新的注意力头。</text><rect x="60" y="1720" width="1100" height="250" rx="17" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="84" y="1763" font-size="31" fill="#355fc0" font-weight="650" text-anchor="start">05 位置编号 → 每对特征的角度</text><text x="84" y="1808" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">不计算旋转角度；没有 sin/cos 运算</text><text x="84" y="1848" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">这一步将 q、k 原样传给注意力打分</text><text x="84" y="1888" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">完整 GPT-2 的位置作用已发生在入口 E + P</text><text x="84" y="1928" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">此处原样传递，不等于 GPT-2 没有位置信息。</text><rect x="60" y="2022" width="1100" height="375" rx="17" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="84" y="2065" font-size="31" fill="#355fc0" font-weight="650" text-anchor="start">06 执行运算：逐对计算两个新数</text><text x="84" y="2110" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">Q 路：q′ = q = [1,2,3,4]</text><text x="84" y="2150" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">K 路：k′ = k = [2,1,0,1]</text><text x="84" y="2190" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">无需在这一步乘任何位置矩阵或增加偏置。</text><text x="84" y="2230" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">为什么不用继续加位置？</text><text x="84" y="2270" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">入口的 X=E+P 已经进入归一化和 Q/K 投影。</text><text x="84" y="2310" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">RoPE 则改变的是每层 Q/K 的配对特征。</text><text x="84" y="2350" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">两种方法的位置注入位置和计算方式都不同。</text><rect x="60" y="2446" width="1100" height="208" rx="17" fill="#edf2ff" stroke="#dce4ec" stroke-width="2"/><text x="84" y="2489" font-size="31" fill="#355fc0" font-weight="650" text-anchor="start">07 本环节输出：仍然是四维向量</text><text x="84" y="2534" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出 q′ = [1,2,3,4]</text><text x="84" y="2574" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出 k′ = [2,1,0,1]；V 原样保留</text><text x="84" y="2614" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">完整张量 Q′、K′ 仍为 [1,1,2,4]；这里只展示一行。</text><rect x="60" y="2703" width="1100" height="211" rx="17" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="84" y="2746" font-size="31" fill="#355fc0" font-weight="650" text-anchor="start">08 交给注意力：s[i,j] = q′ᵢ·k′ⱼ / √dₕ</text><text x="84" y="2791" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">点积：q′·k′ = 1×2 + 2×1 + 3×0 + 4×1 = 8</text><text x="84" y="2831" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">缩放分数 s[1,0] = 8 / √4 = 4</text><text x="84" y="2871" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">分母由每头维度决定；本例 √4=2。</text><rect x="1240" y="1464" width="1100" height="205" rx="17" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="1264" y="1507" font-size="31" fill="#087e75" font-weight="650" text-anchor="start">04 数值输入：一个查询向量与一个键向量</text><text x="1264" y="1552" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">位置 1 的 q = [1,2,3,4]；位置 0 的 k = [2,1,0,1]</text><text x="1264" y="1592" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">配对：q 的 (1,2)、(3,4)；k 的 (2,1)、(0,1)</text><text x="1264" y="1632" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">配对在每个头内部进行，不是再拆出新的注意力头。</text><rect x="1240" y="1720" width="1100" height="250" rx="17" fill="#fff3df" stroke="#dce4ec" stroke-width="2"/><text x="1264" y="1763" font-size="31" fill="#087e75" font-weight="650" text-anchor="start">05 位置编号 → 每对特征的角度</text><text x="1264" y="1808" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">角度公式：φ(t,r)=t × θ^(−2r/dₕ)，r=0,1；单位为弧度</text><text x="1264" y="1848" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">q 位于 t=1：第 0 对 φ=1；第 1 对 φ≈0.001414214</text><text x="1264" y="1888" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">k 位于 t=0：两对角度都是 0，cos(0)=1，sin(0)=0</text><text x="1264" y="1928" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">位置属于向量自身；不会把位置 0 的 k 按位置 1 旋转。</text><rect x="1240" y="2022" width="1100" height="375" rx="17" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="1264" y="2065" font-size="31" fill="#087e75" font-weight="650" text-anchor="start">06 执行运算：逐对计算两个新数</text><text x="1264" y="2110" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">旋转规则：(a,b) → (a cosφ − b sinφ, a sinφ + b cosφ)</text><text x="1264" y="2150" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">第一对：cos(1)≈0.540302；sin(1)≈0.841471</text><text x="1264" y="2190" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">1×cos(1) − 2×sin(1) = −1.142640</text><text x="1264" y="2230" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">1×sin(1) + 2×cos(1) =  1.922076</text><text x="1264" y="2270" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">第二对：φ≈0.001414214，同样计算 (3,4)</text><text x="1264" y="2310" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">(3,4) → (2.994340,4.004239)</text><text x="1264" y="2350" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">k 两对都旋转 0 弧度：(2,1)→(2,1)，(0,1)→(0,1)</text><rect x="1240" y="2446" width="1100" height="208" rx="17" fill="#e8f6f1" stroke="#dce4ec" stroke-width="2"/><text x="1264" y="2489" font-size="31" fill="#087e75" font-weight="650" text-anchor="start">07 本环节输出：仍然是四维向量</text><text x="1264" y="2534" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出 q′ = [−1.142640, 1.922076, 2.994340, 4.004239]</text><text x="1264" y="2574" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">输出 k′ = [2,1,0,1]；V 原样保留</text><text x="1264" y="2614" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">完整张量 Q′、K′ 仍为 [1,1,2,4]；这里只展示一行。</text><rect x="1240" y="2703" width="1100" height="211" rx="17" fill="white" stroke="#dce4ec" stroke-width="2"/><text x="1264" y="2746" font-size="31" fill="#087e75" font-weight="650" text-anchor="start">08 交给注意力：s[i,j] = q′ᵢ·k′ⱼ / √dₕ</text><text x="1264" y="2791" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">点积：q′·k′ = (−1.142640)×2 + 1.922076 + 4.004239</text><text x="1264" y="2831" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">点积 ≈ 3.641035；缩放分数 s[1,0] ≈ 1.820517</text><text x="1264" y="2871" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">这是一个位置对的分数，不是概率；随后参与 softmax。</text><rect x="60" y="2962" width="2280" height="240" rx="20" fill="#fff3df" stroke="none" stroke-width="2"/><text x="84" y="3008" font-size="32" fill="#98601f" font-weight="700" text-anchor="start">参数与数据：一定要分清</text><text x="84" y="3052" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">可训练：GPT-2 的位置表 P；两边的 E、投影 W、归一化参数。θ、位置编号 t、sin/cos 表不是训练参数。</text><text x="84" y="3095" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">本次计算结果：X、U、Q/K/V、旋转后的 Q′/K′、注意力分数；它们随输入变化，不是权重表。</text><text x="84" y="3138" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">RoPE 的目的：角度差 = (j−i) × θ^(−2r/dₕ)，使点积包含相对位置关系；不保证分数随距离单调降低。</text><text x="84" y="3181" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">旋转保留向量长度，改变配对方向；有多个位置时，分数改变会影响读取各位置 V 的权重。</text><text x="65" y="3255" font-size="26" fill="#586c7d" font-weight="400" text-anchor="start">范围：原始 Llama 3，相邻两维配对；θ 沿用官方配置，维度与向量是教学缩小示例。未运行模型训练。</text><text x="65" y="3298" font-size="25" fill="#586c7d" font-weight="400" text-anchor="start">来源：Meta llama3/llama/model.py 中 precompute_freqs_cis / apply_rotary_emb；GPT-2 对照项目既有实现。</text><text x="65" y="3341" font-size="25" fill="#586c7d" font-weight="400" text-anchor="start">数值核验：旋转前后平方长度相同；q 在位置 2、k 在位置 1 时，与位置 1/0 的点积相同（固定原始 q/k）。</text></svg>