<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="3515" viewBox="0 0 2600 3515">
<title>1/3  输入、归一化与 QKV：输入 → 计算 → 输出</title><desc>逐步标注输入、参数、计算、输出形状和差异 A 到 F；数字为缩小教学配置。</desc>
<style>text {font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style>
<rect width="2600" height="3515" fill="#f5f8fb"/><text x="65" y="80" font-size="48" fill="#183044" font-weight="700" text-anchor="start">1/3  输入、归一化与 QKV：输入 → 计算 → 输出</text><text x="65" y="135" font-size="31" fill="#183044" font-weight="400" text-anchor="start">蓝色 GPT-2 ｜ 绿色 Llama 3 ｜ 橙色差异带：明确标出改变了什么</text><text x="65" y="187" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">教学设置：B=2、T=5、D=16、词表 Vocab=100；Q 头=4；GPT-2 KV 头=4，Llama KV 头=2；每头 4 维。</text><text x="65" y="231" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">按推理 eval 模式展开公共前向，不画 Dropout/KV Cache；MLP 宽度 64 vs 48 仅为教学，并非等参数量实验。</text><text x="65" y="275" font-size="27" fill="#526a7b" font-weight="400" text-anchor="start">索引：b 样本，t/i/j 位置（lm_head 的 j 为词表 ID），h 头，d/k 特征；⊙ 逐元素乘，Σ 求和；各模型参数独立。</text><rect x="60" y="320" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="364" font-size="32" fill="#183044" font-weight="700" text-anchor="start">00  整数 ID 作为共同起点</text><text x="1240" y="364" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同接口</text><rect x="82" y="404" width="1090" height="251" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="446" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="491" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：已分词的两条文本，每条 5 个 Token</text><text x="106" y="532" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：把 Token ID 排成整数张量 I</text><text x="106" y="573" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：I [2,5]；示例 ID 范围为 0…99</text><text x="106" y="614" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：供 Embedding 查表，ID 本身不参与梯度更新</text><rect x="1382" y="404" width="1090" height="251" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="446" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="491" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：已分词的两条文本，每条 5 个 Token</text><text x="1406" y="532" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：把 Token ID 排成整数张量 I</text><text x="1406" y="573" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：I [2,5]；示例 ID 范围为 0…99</text><text x="1406" y="614" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：供 Embedding 查表，ID 本身不参与梯度更新</text><rect x="60" y="712" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="756" font-size="32" fill="#183044" font-weight="700" text-anchor="start">01  查表，建立初始向量</text><text x="1240" y="756" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 A · 位置信息入口</text><rect x="82" y="796" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="838" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="883" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：I [2,5]；位置 t = 0,1,2,3,4</text><text x="106" y="924" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：Token 表 E [100,16]；位置表 P [Cmax,16]</text><text x="106" y="965" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：X₀[b,t,d] = E[I[b,t],d] + P[t,d]</text><text x="106" y="1006" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：X₀ [2,5,16]；P[t] 在 batch 维广播</text><text x="106" y="1047" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：同时把 Token 内容与绝对位置送入网络</text><rect x="1382" y="796" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="838" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="883" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：I [2,5]</text><text x="1406" y="924" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：Token 表 E [100,16]；没有可学习的位置表 P</text><text x="1406" y="965" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：X₀[b,t,d] = E[I[b,t],d]</text><text x="1406" y="1006" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：X₀ [2,5,16]；位置 t 留给第 05 步 RoPE</text><text x="1406" y="1047" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：先取得内容向量，再在注意力中注入位置</text><rect x="60" y="1145" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="1189" font-size="32" fill="#183044" font-weight="700" text-anchor="start">02  保存当前 Block 的输入 X</text><text x="1240" y="1189" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同 · 残差旁路起点</text><rect x="82" y="1229" width="1090" height="251" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="1271" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="1316" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：首层取 X₀；后续层取上一层输出 Y</text><text x="106" y="1357" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：X = 当前层输入；保留 X 供第 12 步相加</text><text x="106" y="1398" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：主分支 X [2,5,16]；旁路 X [2,5,16]</text><text x="106" y="1439" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：原输入绕过归一化与注意力，保留直接通路</text><rect x="1382" y="1229" width="1090" height="251" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="1271" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="1316" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：首层取 X₀；后续层取上一层输出 Y</text><text x="1406" y="1357" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：X = 当前层输入；保留 X 供第 12 步相加</text><text x="1406" y="1398" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：主分支 X [2,5,16]；旁路 X [2,5,16]</text><text x="1406" y="1439" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：原输入绕过归一化与注意力，保留直接通路</text><rect x="60" y="1537" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="1581" font-size="32" fill="#183044" font-weight="700" text-anchor="start">03  第一次归一化</text><text x="1240" y="1581" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 B · LayerNorm / RMSNorm</text><rect x="82" y="1621" width="1090" height="333" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="1663" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="1708" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：X [2,5,16]；每次只处理一个 Token 的 16 维</text><text x="106" y="1749" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：γ₁、β₁ 各 [16]；ε 是固定的小正数</text><text x="106" y="1790" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：μ = (Σd Xd)/16；σ² = Σd(Xd−μ)²/16</text><text x="106" y="1831" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Ud = γ₁,d × (Xd−μ)/√(σ²+ε) + β₁,d</text><text x="106" y="1872" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：U [2,5,16]；不混合不同 Token 或样本</text><text x="106" y="1913" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：先居中，再缩放，并做可学习的仿射变换</text><rect x="1382" y="1621" width="1090" height="333" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="1663" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="1708" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：X [2,5,16]；每次只处理一个 Token 的 16 维</text><text x="1406" y="1749" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：γ₁ [16]；没有平移参数 β₁</text><text x="1406" y="1790" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：r = √((Σd Xd²)/16 + ε)</text><text x="1406" y="1831" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Ud = γ₁,d × Xd/r；不减去均值</text><text x="1406" y="1872" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：U [2,5,16]；不混合不同 Token 或样本</text><text x="1406" y="1913" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：控制向量尺度，并保留可学习的逐维缩放</text><rect x="60" y="2011" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="2055" font-size="32" fill="#183044" font-weight="700" text-anchor="start">04  Q / K / V 投影并拆成头</text><text x="1240" y="2055" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 C · 头数；差异 D · bias</text><rect x="82" y="2095" width="1090" height="333" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="2137" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="2182" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：U [2,5,16]</text><text x="106" y="2223" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：Wq、Wk、Wv 各 [16,16]；bq、bk、bv 各 [16]</text><text x="106" y="2264" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Q₀ = U Wq + bq；K₀ = U Wk + bk；V₀ = U Wv + bv</text><text x="106" y="2305" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：各 [2,5,16] → reshape [2,5,4,4]</text><text x="106" y="2346" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：交换位置轴与头轴 → [2,4,5,4]</text><text x="106" y="2387" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Q、K、V 都是 [2,4,5,4]；4 头，每头 4 维</text><rect x="1382" y="2095" width="1090" height="333" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="2137" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="2182" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：U [2,5,16]</text><text x="1406" y="2223" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：Wq [16,16]；Wk、Wv 各 [16,8]；没有 bias</text><text x="1406" y="2264" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Q₀ = U Wq；K₀ = U Wk；V₀ = U Wv</text><text x="1406" y="2305" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Q₀ [2,5,16] → [2,5,4,4] → Q [2,4,5,4]</text><text x="1406" y="2346" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：K₀/V₀ [2,5,8] → [2,5,2,4] → [2,2,5,4]</text><text x="1406" y="2387" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：4 个 Q 头、2 个 K/V 头；每头仍为 4 维</text><rect x="60" y="2485" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="2529" font-size="32" fill="#183044" font-weight="700" text-anchor="start">05  在 Q / K 中处理位置</text><text x="1240" y="2529" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 A · 每层 RoPE</text><rect x="82" y="2569" width="1090" height="333" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="2611" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="2656" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Q、K [2,4,5,4]；V [2,4,5,4]</text><text x="106" y="2697" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Q′ = Q；K′ = K；不额外旋转</text><text x="106" y="2738" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">原因：位置表 P 已在第 01 步加入网络输入</text><text x="106" y="2779" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Q′、K′、V 仍为 [2,4,5,4]</text><rect x="1382" y="2569" width="1090" height="333" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="2611" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="2656" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Q [2,4,5,4]；K、V [2,2,5,4]；位置 t</text><text x="1406" y="2697" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：每头按 (x₀,x₁)、(x₂,x₃) 两对处理，r=0,1</text><text x="1406" y="2738" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">角度：φ = t × θ^(−2r/4)；θ 为配置常数</text><text x="1406" y="2779" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">旋转：x′₂r = x₂r cosφ − x₂r+1 sinφ</text><text x="1406" y="2820" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">旋转：x′₂r+1 = x₂r sinφ + x₂r+1 cosφ</text><text x="1406" y="2861" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Q′、K′ 形状不变；V 不旋转；无新位置参数表</text><rect x="60" y="2959" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="3003" font-size="32" fill="#183044" font-weight="700" text-anchor="start">06  把 Q 头与 K/V 头对应起来</text><text x="1240" y="3003" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 C · MHA / GQA</text><rect x="82" y="3043" width="1090" height="333" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="3085" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="3130" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Q′、K′、V，各 4 个头；头编号 h=0…3</text><text x="106" y="3171" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：K* = K′；V* = V，每个 Q 头使用同号 K/V 头</text><text x="106" y="3212" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">对应：Q₀→KV₀；Q₁→KV₁；Q₂→KV₂；Q₃→KV₃</text><text x="106" y="3253" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Q′、K*、V* 都是 [2,4,5,4]</text><rect x="1382" y="3043" width="1090" height="333" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="3085" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="3130" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Q′ 有 4 头；K′、V 各有 2 头</text><text x="1406" y="3171" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：g(h)=floor(h/2)；K*[:,h]=K′[:,g(h)]</text><text x="1406" y="3212" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：V*[:,h]=V[:,g(h)]；同组使用相同 K/V 数值</text><text x="1406" y="3253" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">对应：Q₀/Q₁→KV₀；Q₂/Q₃→KV₁</text><text x="1406" y="3294" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：逻辑对齐后的 Q′、K*、V* 均为 [2,4,5,4]</text><text x="1406" y="3335" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">说明：扩展是数学展示；高效内核可直接按组计算</text><text x="65" y="3438" font-size="26" fill="#526a7b" font-weight="400" text-anchor="start">读图：同一行横向比较；纵向按编号追踪张量。名称带 W、E、P、γ、β、b 的参数，与本次前向算出的张量要分清。</text><text x="65" y="3482" font-size="25" fill="#526a7b" font-weight="400" text-anchor="start">来源：Raschka GPT→Llama 教程、Meta Llama 3 官方 model.py、本项目 GPT-2 前向；Llama 3 不含 Qwen3 的 QK-Norm。</text></svg>