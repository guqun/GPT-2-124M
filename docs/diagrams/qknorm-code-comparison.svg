<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3820" viewBox="0 0 2400 3820"><title>QK-Norm 代码与数值对照</title><style>text{font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style><rect width="2400" height="3820" fill="#f5f8fb"/><path d="M 610 350 L 610 384" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,384 603.0,368.0 617.0,368.0" fill="#355fc0"/><path d="M 1790 350 L 1790 384" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,384 1783.0,368.0 1797.0,368.0" fill="#087e75"/><path d="M 610 682 L 610 716" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,716 603.0,700.0 617.0,700.0" fill="#355fc0"/><path d="M 1790 682 L 1790 716" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,716 1783.0,700.0 1797.0,700.0" fill="#087e75"/><path d="M 610 1094 L 610 1128" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,1128 603.0,1112.0 617.0,1112.0" fill="#355fc0"/><path d="M 1790 1094 L 1790 1128" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1128 1783.0,1112.0 1797.0,1112.0" fill="#087e75"/><path d="M 610 1586 L 610 1620" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,1620 603.0,1604.0 617.0,1604.0" fill="#355fc0"/><path d="M 1790 1586 L 1790 1620" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,1620 1783.0,1604.0 1797.0,1604.0" fill="#087e75"/><path d="M 610 1998 L 610 2032" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,2032 603.0,2016.0 617.0,2016.0" fill="#355fc0"/><path d="M 1790 1998 L 1790 2032" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,2032 1783.0,2016.0 1797.0,2016.0" fill="#087e75"/><path d="M 610 2330 L 610 2364" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,2364 603.0,2348.0 617.0,2348.0" fill="#355fc0"/><path d="M 1790 2330 L 1790 2364" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,2364 1783.0,2348.0 1797.0,2348.0" fill="#087e75"/><path d="M 610 2742 L 610 2776" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,2776 603.0,2760.0 617.0,2760.0" fill="#355fc0"/><path d="M 1790 2742 L 1790 2776" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,2776 1783.0,2760.0 1797.0,2760.0" fill="#087e75"/><path d="M 610 3074 L 610 3108" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,3108 603.0,3092.0 617.0,3092.0" fill="#355fc0"/><path d="M 1790 3074 L 1790 3108" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,3108 1783.0,3092.0 1797.0,3092.0" fill="#087e75"/><path d="M 610 3446 L 610 3480" stroke="#355fc0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="610,3480 603.0,3464.0 617.0,3464.0" fill="#355fc0"/><path d="M 1790 3446 L 1790 3480" stroke="#087e75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1790,3480 1783.0,3464.0 1797.0,3464.0" fill="#087e75"/><text x="60" y="78" font-size="44" fill="#172b40" font-weight="700" text-anchor="start">QK-Norm 实践：原始 Q/K → 头内归一化 → RoPE → KV Cache</text><text x="60" y="132" font-size="28" fill="#172b40" font-weight="400" text-anchor="start">左：原 GQA 参照   右：新增 QK-Norm   红框标差异；两边均为 4 Q / 2 KV，缓存容量不变。</text><rect x="60" y="174" width="1100" height="176" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="218" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">A · run_qknorm_reference.py → main(False)</text><text x="84" y="263" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q_norm / k_norm = Identity；前课 GQA 计算不变。</text><text x="84" y="303" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">相同随机起点、合成 ID、CPU / FP32。</text><rect x="1240" y="174" width="1100" height="176" rx="20" fill="#fff8ed" stroke="#cf4141" stroke-width="2"/><text x="1264" y="218" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">B · run_qknorm.py → main(True)</text><text x="1264" y="263" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每层新增 gamma_Q[32]、gamma_K[32]，初始全 1。</text><text x="1264" y="303" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">两层共 128 个新参数；无 beta，V 不归一化。</text><rect x="60" y="388" width="2280" height="60" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="428" font-size="30" fill="#172b40" font-weight="700" text-anchor="start">01  共同投影与拆头 · qknorm_model.py · QKNormAttention.step · L55</text><rect x="60" y="466" width="2280" height="216" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="510" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">[N2] 输入是当前 Block 入口归一化后的 U；Q/K/V 是投影结果，不是权重</text><text x="84" y="555" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">默认：U[B,T,128]；WQ[128,128]，WK/WV[64,128]（PyTorch [out,in]）。</text><text x="84" y="595" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q=U WQᵀ → [B,4,T,32]；k=U WKᵀ、v=U WVᵀ → 各 [B,2,T,32]。</text><text x="84" y="635" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">入口 RMSNorm 沿 128 维；新增 Q/K-Norm 沿每头 32 维。原 U 已归一化，不代表投影后的 q/k 尺度不变。</text><rect x="60" y="720" width="2280" height="60" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="760" font-size="30" fill="#172b40" font-weight="700" text-anchor="start">02  缩小成可手算的输入：D=4、Hq=2、Hkv=1、d=2；只展示 Q 头1，位置0与位置1</text><rect x="60" y="798" width="2280" height="296" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="842" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">教学数值：从输入和参数算出原始 q/k/v；不代表默认模型实测</text><text x="84" y="887" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">U₀=[1,0,0,0]；U₁=[0,1,0,0]。以下 W 是模型参数，均按 [out,in] 列出。</text><text x="84" y="927" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">WQ头1=[[1,3,0,0],[2,4,0,0]]；q₁=U₁WQ头1ᵀ=[0×1+1×3, 0×2+1×4]=[3,4]。</text><text x="84" y="967" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">WK=[[4,0,0,0],[3,5,0,0]]；k₀=U₀WKᵀ=[4,3]；k₁=U₁WKᵀ=[0,5]。</text><text x="84" y="1007" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">WV=[[2,0,0,0],[0,4,0,0]]；v₀=[2,0]；v₁=[0,4]。</text><text x="84" y="1047" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">下标0/1在这里表示 Token 位置；γQ=γK=[1,1]，ε=0.00001；此图计算保留 ε。</text><rect x="60" y="1132" width="2280" height="60" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="1172" font-size="30" fill="#172b40" font-weight="700" text-anchor="start">03  在此分叉 · [N3] 调用 qknorm_model.py · HeadRMSNorm.forward · L28</text><rect x="60" y="1210" width="1100" height="376" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="1254" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">A · Identity：原值直接作为 RoPE 输入</text><text x="84" y="1299" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q₁=[3,4]。</text><text x="84" y="1339" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k₀=[4,3]；k₁=[0,5]。</text><text x="84" y="1379" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">没有本步骤的 gamma，也没有均方根计算。</text><text x="84" y="1419" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">注意：上游 Block 入口的 RMSNorm 仍然存在。</text><text x="84" y="1459" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">V 不经过 QK-Norm，也不经过 RoPE。</text><text x="84" y="1499" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">原 V₀=[2,0]、V₁=[0,4] 一直保留到 AV。</text><rect x="1240" y="1210" width="1100" height="376" rx="20" fill="#fff8ed" stroke="#cf4141" stroke-width="2"/><text x="1264" y="1254" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">B · 每条向量独立算 r，再除 r、乘 gamma</text><text x="1264" y="1299" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q₁²=[9,16] → 和=25 → 均值=12.5。</text><text x="1264" y="1339" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">rq=√(12.5+0.00001)=3.535535。</text><text x="1264" y="1379" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q₁/rq × [1,1] = [0.848528, 1.131370]。</text><text x="1264" y="1419" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k₀²=[16,9]；k₁²=[0,25] → 各自均值也为12.5。</text><text x="1264" y="1459" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k₀/rk₀ × [1,1] = [1.131370, 0.848528]。</text><text x="1264" y="1499" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k₁/rk₁ × [1,1] = [0.000000, 1.414213]。</text><text x="1264" y="1539" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">三条 r 本例恰好相同；实际必须逐条算，不能共用。</text><rect x="60" y="1624" width="2280" height="60" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="1664" font-size="30" fill="#172b40" font-weight="700" text-anchor="start">04  RoPE 接收上一步的输出 · [N4]；d=2 的唯一频率为1，位置1旋转1弧度</text><rect x="60" y="1702" width="1100" height="296" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="1746" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">A · 旋转未经 QK-Norm 的原值</text><text x="84" y="1791" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">cos(1)=0.540302；sin(1)=0.841471。</text><text x="84" y="1831" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q′₁=[3cos−4sin, 3sin+4cos]。</text><text x="84" y="1871" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q′₁=[-1.744977, 4.685622]。</text><text x="84" y="1911" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k′₀=[4.000000, 3.000000]（位置0不转）。</text><text x="84" y="1951" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k′₁=[-4.207355, 2.701512]。</text><rect x="1240" y="1702" width="1100" height="296" rx="20" fill="#fff8ed" stroke="#cf4141" stroke-width="2"/><text x="1264" y="1746" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">B · 旋转归一化/缩放后的值</text><text x="1264" y="1791" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">令 a=0.848528、b=1.131370（上一步的 q）。</text><text x="1264" y="1831" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q′₁=[a cos−b sin, a sin+b cos]；角度仍为1。</text><text x="1264" y="1871" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">q′₁=[-0.493554, 1.325294]。</text><text x="1264" y="1911" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k′₀=[1.131370, 0.848528]。</text><text x="1264" y="1951" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">k′₁=[-1.190019, 0.764103]。</text><rect x="60" y="2036" width="2280" height="60" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="2076" font-size="30" fill="#172b40" font-weight="700" text-anchor="start">05  旧缓存 + 新 K/V · [N4] 沿位置轴 cat；这里只展开一层、一个 KV 头</text><rect x="60" y="2114" width="1100" height="216" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="2158" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">A · K 缓存保存原投影再旋转的结果</text><text x="84" y="2203" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">旧行 k′₀=[4.000000, 3.000000]。</text><text x="84" y="2243" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">追加新行 k′₁=[-4.207355, 2.701512]。</text><text x="84" y="2283" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">K两行；V两行=[2,0]、[0,4]；当前位置 q′₁ 不缓存。</text><rect x="1240" y="2114" width="1100" height="216" rx="20" fill="#fff8ed" stroke="#cf4141" stroke-width="2"/><text x="1264" y="2158" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">B · K 缓存保存归一化再旋转的结果</text><text x="1264" y="2203" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">旧行 k′₀=[1.131370, 0.848528]，直接复用。</text><text x="1264" y="2243" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">追加新行 k′₁=[-1.190019, 0.764103]。</text><text x="1264" y="2283" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">旧 K 不重复 Norm/RoPE；V 与左侧完全相同。</text><rect x="60" y="2368" width="2280" height="60" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="2408" font-size="30" fill="#172b40" font-weight="700" text-anchor="start">06  GQA 的 QK → A → H 规则不变 · [N5] grouped_attention；本例两个位置均可见</text><rect x="60" y="2446" width="1100" height="296" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="2490" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">A · 分数与输出</text><text x="84" y="2535" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">分数=[q′₁·k′₀, q′₁·k′₁] / √2。</text><text x="84" y="2575" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">scores=[5.004165, 14.142136]。</text><text x="84" y="2615" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">A=softmax(scores)=[0.000107, 0.999893]。</text><text x="84" y="2655" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">H=A₀×[2,0]+A₁×[0,4]。</text><text x="84" y="2695" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">H=[0.000215, 3.999570]；图中显示值已舍入。</text><rect x="1240" y="2446" width="1100" height="296" rx="20" fill="#fff8ed" stroke="#cf4141" stroke-width="2"/><text x="1264" y="2490" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">B · 尺度改变，分数与输出随之改变</text><text x="1264" y="2535" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">分数=[q′₁·k′₀, q′₁·k′₁] / √2。</text><text x="1264" y="2575" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">scores=[0.400333, 1.131370]。</text><text x="1264" y="2615" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">A=softmax(scores)=[0.324967, 0.675033]。</text><text x="1264" y="2655" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">H=A₀×[2,0]+A₁×[0,4]。</text><text x="1264" y="2695" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">H=[0.649934, 2.700131]；图中显示值已舍入。</text><rect x="60" y="2780" width="2280" height="60" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="2820" font-size="30" fill="#172b40" font-weight="700" text-anchor="start">07  完整模型继续流转 · gqa_model.GroupedDecoder；训练走普通模型 forward</text><rect x="60" y="2858" width="2280" height="216" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="2902" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">每个 Q 头各自得到 H → 拼头/输出投影 → 残差 → Norm/SwiGLU/残差 → 下一层</text><text x="84" y="2947" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">推理：各层只处理新 Token；最终 Norm → 末位置 lm_head → logits → 选 ID → 下一轮（携带各层缓存）。</text><text x="84" y="2987" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">训练检查：独立副本输入完整序列 → 全位置 logits → 交叉熵均值 → backward → AdamW.step，无 KV Cache。</text><text x="84" y="3027" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新增 gamma 已注册为 Parameter，优化器包含它们；推理原模型不更新，训练副本用完丢弃。</text><rect x="60" y="3112" width="2280" height="60" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="3152" font-size="30" fill="#172b40" font-weight="700" text-anchor="start">08  默认规模的参数、缓存与核验 · qknorm_experiment.py · main · L104</text><rect x="60" y="3190" width="1100" height="256" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="3234" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">A · 原 GQA：4 Q / 2 KV，2层</text><text x="84" y="3279" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">参数：6,793,728；不含新增 gamma。</text><text x="84" y="3319" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">提示32 + 生成16 → 末次缓存长47。</text><text x="84" y="3359" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每层 K/V 各 [1,2,47,32]。</text><text x="84" y="3399" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">全部层 KV 有效字节 48,128。</text><rect x="1240" y="3190" width="1100" height="256" rx="20" fill="#fff8ed" stroke="#cf4141" stroke-width="2"/><text x="1264" y="3234" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">B · GQA + QK-Norm</text><text x="1264" y="3279" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">新增：2层 × (32个γQ + 32个γK) = 128。</text><text x="1264" y="3319" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">参数：6,793,856；同层同类头共享 gamma。</text><text x="1264" y="3359" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">每条向量独立统计；缓存形状仍 [1,2,47,32]。</text><text x="1264" y="3399" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">全部层 KV 仍 48,128 字节；K 的数值改变。</text><rect x="60" y="3484" width="2280" height="176" rx="20" fill="white" stroke="#d9e4ed" stroke-width="2"/><text x="84" y="3528" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">compare_qknorm_runs.py：各模型内部检查缓存等价；两个版本之间不要求 logits 相同</text><text x="84" y="3573" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">核对共同参数初值 → 各自重算/缓存分数与贪心 ID → 参数 +128 / 缓存字节不变 → 副本 gamma 梯度与更新。</text><text x="84" y="3613" font-size="27" fill="#172b40" font-weight="400" text-anchor="start">gamma=1 仍执行 x/r，不等于 Identity。单步合成数据检查只验证训练链路，不证明质量提升或完整训练完成。</text><text x="70" y="3720" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">来源：Transformers v4.51.3 Qwen3Attention / Qwen3RMSNorm；本课沿用相邻配对 RoPE、共享 lm_head、ε=1e-5。</text><text x="70" y="3762" font-size="26" fill="#172b40" font-weight="400" text-anchor="start">只新增 QK-Norm，不声称复现完整 Qwen3。每层 Norm 参数独立；修改模型或上下文后必须重新建立缓存。</text></svg>