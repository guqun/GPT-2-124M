<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1560" viewBox="0 0 1440 1560" role="img" aria-labelledby="title desc"><title id="title">普通注意力与输出门控注意力的数值流程对照</title><desc id="desc">共同用 A 和 V 算出 H，再沿普通路径投影，或从当前输入计算门值并逐特征相乘后投影。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#65808b"/></marker></defs><g font-family="PingFang SC, Helvetica Neue, sans-serif">
<rect x="0" y="0" width="1440" height="1560" rx="0" fill="#f4f7f7" stroke="none" stroke-width="1.5"/>
<rect x="0" y="0" width="1440" height="128" rx="0" fill="#173b48" stroke="none" stroke-width="1.5"/>
<text x="42" y="60" font-size="43" fill="white" font-weight="650" text-anchor="start">普通注意力与门控注意力</text>
<text x="44" y="102" font-size="23" fill="#daece7" font-weight="400" text-anchor="start">跟踪第 2 个 Token 的一个头　·　2 个可见位置　·　每个值向量有 2 维　·　行向量右乘</text>
<rect x="36" y="152" width="1368" height="354" rx="12" fill="white" stroke="#c4d4d8" stroke-width="1.5"/>
<text x="60" y="196" font-size="29" fill="#183847" font-weight="650" text-anchor="start">共同计算　两种方案先用相同的 A 和 V 读出 H</text>
<text x="60" y="238" font-size="23" fill="#496370" font-weight="400" text-anchor="start">给定当前查询经过 QKᵀ 缩放、因果遮罩和 softmax 后的一行注意力权重 A = [0.75, 0.25]。</text>
<text x="68" y="289" font-size="20" fill="#496370" font-weight="400" text-anchor="start">可见位置</text>
<text x="215" y="289" font-size="20" fill="#496370" font-weight="400" text-anchor="start">A 中的权重</text>
<text x="403" y="289" font-size="20" fill="#496370" font-weight="400" text-anchor="start">对应的 V 行</text>
<text x="637" y="289" font-size="20" fill="#496370" font-weight="400" text-anchor="start">整行乘以位置权重</text>
<text x="68" y="337" font-size="23" fill="#183847" font-weight="400" text-anchor="start">Token 1</text>
<text x="215" y="337" font-size="24" fill="#255895" font-weight="650" text-anchor="start">0.75</text>
<text x="403" y="337" font-size="24" fill="#183847" font-weight="400" text-anchor="start">[4, 0]</text>
<text x="637" y="337" font-size="24" fill="#183847" font-weight="400" text-anchor="start">0.75 × [4, 0] = [3, 0]</text>
<text x="68" y="388" font-size="23" fill="#183847" font-weight="400" text-anchor="start">Token 2</text>
<text x="215" y="388" font-size="24" fill="#255895" font-weight="650" text-anchor="start">0.25</text>
<text x="403" y="388" font-size="24" fill="#183847" font-weight="400" text-anchor="start">[0, 8]</text>
<text x="637" y="388" font-size="24" fill="#183847" font-weight="400" text-anchor="start">0.25 × [0, 8] = [0, 2]</text>
<rect x="60" y="416" width="1318" height="66" rx="8" fill="#eaf1f3" stroke="none" stroke-width="1.5"/>
<text x="80" y="459" font-size="28" fill="#183847" font-weight="650" text-anchor="start">逐维相加　H = A V = [3, 0] + [0, 2] = [3, 2]</text>
<text x="1360" y="456" font-size="20" fill="#496370" font-weight="400" text-anchor="end">[1×2] × [2×2] → [1×2]</text>
<path d="M720 506 V534 H364 V553" fill="none" stroke="#65808b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M720 534 H1076 V553" fill="none" stroke="#65808b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="36" y="560" width="656" height="60" rx="12" fill="#255895" stroke="none" stroke-width="1.5"/>
<rect x="748" y="560" width="656" height="60" rx="12" fill="#166857" stroke="none" stroke-width="1.5"/>
<text x="60" y="600" font-size="30" fill="white" font-weight="650" text-anchor="start">普通注意力</text>
<text x="772" y="600" font-size="30" fill="white" font-weight="650" text-anchor="start">门控注意力</text>
<rect x="36" y="640" width="656" height="495" rx="12" fill="white" stroke="#b7cce0" stroke-width="1.5"/>
<rect x="748" y="640" width="656" height="315" rx="12" fill="#fff9f2" stroke="#c8794b" stroke-width="2.3"/>
<text x="60" y="686" font-size="27" fill="#255895" font-weight="650" text-anchor="start">H 直接送往输出投影</text>
<text x="60" y="735" font-size="22" fill="#496370" font-weight="400" text-anchor="start">头输出的两个分量</text>
<rect x="60" y="762" width="101" height="57" rx="5" fill="#e8f0f8" stroke="none" stroke-width="1.5"/>
<text x="110.5" y="802.87" font-size="22" fill="#255895" font-weight="650" text-anchor="middle">3</text>
<rect x="165" y="762" width="101" height="57" rx="5" fill="#e8f0f8" stroke="none" stroke-width="1.5"/>
<text x="215.5" y="802.87" font-size="22" fill="#255895" font-weight="650" text-anchor="middle">2</text>
<text x="60" y="872" font-size="25" fill="#255895" font-weight="650" text-anchor="start">投影输入仍是 [3, 2]。</text>
<text x="60" y="928" font-size="22" fill="#496370" font-weight="400" text-anchor="start">多头时，先把所有头的结果按特征轴拼接。</text>
<text x="60" y="969" font-size="22" fill="#496370" font-weight="400" text-anchor="start">本例只有一个头，拼接结果就是这个行向量。</text>
<text x="772" y="686" font-size="27" fill="#9d461d" font-weight="650" text-anchor="start">分歧起点　新增一条门投影支路</text>
<text x="772" y="728" font-size="23" fill="#183847" font-weight="400" text-anchor="start">当前 Token 的隐藏向量 x = [1, 2]</text>
<text x="772" y="795" font-size="23" fill="#183847" font-weight="400" text-anchor="start">Wg =</text>
<rect x="850" y="753" width="86" height="34" rx="5" fill="#fae8d7" stroke="none" stroke-width="1.5"/>
<text x="893.0" y="778.46" font-size="22" fill="#9d461d" font-weight="650" text-anchor="middle">ln 4</text>
<rect x="940" y="753" width="86" height="34" rx="5" fill="#fae8d7" stroke="none" stroke-width="1.5"/>
<text x="983.0" y="778.46" font-size="22" fill="#9d461d" font-weight="650" text-anchor="middle">0</text>
<rect x="850" y="791" width="86" height="34" rx="5" fill="#fae8d7" stroke="none" stroke-width="1.5"/>
<text x="893.0" y="816.46" font-size="22" fill="#9d461d" font-weight="650" text-anchor="middle">0</text>
<rect x="940" y="791" width="86" height="34" rx="5" fill="#fae8d7" stroke="none" stroke-width="1.5"/>
<text x="983.0" y="816.46" font-size="22" fill="#9d461d" font-weight="650" text-anchor="middle">−ln 2</text>
<text x="1055" y="780" font-size="19" fill="#496370" font-weight="400" text-anchor="start">第 1 列算特征 1 的门分数</text>
<text x="1055" y="813" font-size="19" fill="#496370" font-weight="400" text-anchor="start">第 2 列算特征 2 的门分数</text>
<text x="772" y="862" font-size="22" fill="#183847" font-weight="400" text-anchor="start">x Wg = [1 × ln 4 + 2 × 0,  1 × 0 − 2 × ln 2]</text>
<text x="772" y="898" font-size="23" fill="#183847" font-weight="400" text-anchor="start">          = [ln 4, −ln 4]</text>
<text x="772" y="933" font-size="23" fill="#166857" font-weight="650" text-anchor="start">g = sigmoid(x Wg) = [4/5, 1/5] = [0.8, 0.2]</text>
<path d="M1076 955 V977" fill="none" stroke="#65808b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="748" y="984" width="656" height="151" rx="12" fill="white" stroke="#91bdae" stroke-width="1.5"/>
<text x="772" y="1024" font-size="25" fill="#166857" font-weight="650" text-anchor="start">两路合并　把 g 逐特征乘到 H 上</text>
<text x="772" y="1068" font-size="25" fill="#183847" font-weight="400" text-anchor="start">H ⊙ g = [3 × 0.8, 2 × 0.2] = [2.4, 0.4]</text>
<text x="772" y="1110" font-size="20" fill="#496370" font-weight="400" text-anchor="start">多头时拼接各头门控后的结果。本例得到 [2.4, 0.4]。</text>
<path d="M364 1135 V1162" fill="none" stroke="#65808b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1076 1135 V1162" fill="none" stroke="#65808b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="36" y="1170" width="1368" height="295" rx="12" fill="white" stroke="#c4d4d8" stroke-width="1.5"/>
<text x="60" y="1212" font-size="28" fill="#183847" font-weight="650" text-anchor="start">同一个输出投影 Wₒ</text>
<text x="60" y="1264" font-size="22" fill="#183847" font-weight="400" text-anchor="start">Wₒ =</text>
<rect x="134" y="1227" width="52" height="34" rx="5" fill="#eaf1f3" stroke="none" stroke-width="1.5"/>
<text x="160.0" y="1252.46" font-size="22" fill="#183847" font-weight="650" text-anchor="middle">1</text>
<rect x="190" y="1227" width="52" height="34" rx="5" fill="#eaf1f3" stroke="none" stroke-width="1.5"/>
<text x="216.0" y="1252.46" font-size="22" fill="#183847" font-weight="650" text-anchor="middle">1</text>
<rect x="134" y="1265" width="52" height="34" rx="5" fill="#eaf1f3" stroke="none" stroke-width="1.5"/>
<text x="160.0" y="1290.46" font-size="22" fill="#183847" font-weight="650" text-anchor="middle">0</text>
<rect x="190" y="1265" width="52" height="34" rx="5" fill="#eaf1f3" stroke="none" stroke-width="1.5"/>
<text x="216.0" y="1290.46" font-size="22" fill="#183847" font-weight="650" text-anchor="middle">1</text>
<text x="275" y="1269" font-size="22" fill="#183847" font-weight="400" text-anchor="start">[u, v] Wₒ = [u × 1 + v × 0, u × 1 + v × 1] = [u, u + v]。本例取无偏置。</text>
<rect x="60" y="1322" width="632" height="117" rx="12" fill="#eaf1f9" stroke="none" stroke-width="1.5"/>
<rect x="748" y="1322" width="630" height="117" rx="12" fill="#e8f4ee" stroke="none" stroke-width="1.5"/>
<text x="82" y="1363" font-size="23" fill="#255895" font-weight="650" text-anchor="start">普通路径　O = H Wₒ</text>
<text x="82" y="1411" font-size="26" fill="#255895" font-weight="650" text-anchor="start">[3, 2] Wₒ = [3, 3 + 2] = [3, 5]</text>
<text x="770" y="1363" font-size="23" fill="#166857" font-weight="650" text-anchor="start">门控路径　O = (H ⊙ g) Wₒ</text>
<text x="770" y="1411" font-size="26" fill="#166857" font-weight="650" text-anchor="start">[2.4, 0.4] Wₒ = [2.4, 2.8]</text>
<text x="43" y="1510" font-size="24" fill="#183847" font-weight="650" text-anchor="start">两边的 O 都交给注意力分支的残差加法。A 按 Token 位置加权；g 按读出向量的特征缩放。</text>
</g></svg>
