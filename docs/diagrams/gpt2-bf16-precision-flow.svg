<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900">
<title>BF16 自动混合精度：前向、反向与参数更新的精度变化</title>
<desc>FP32 原参数在前向按需生成 BF16 计算表示，反向中间梯度按路径使用不同精度，原参数梯度和 AdamW 状态保持 FP32，更新后进入下一批。</desc>
<style>text { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; }</style>
<rect width="2400" height="1900" fill="#f8fafb"/>
<text x="58" y="80" font-size="56" font-weight="750" text-anchor="start" fill="#142d3b">一次训练更新，精度怎样流动？</text><text x="60" y="130" font-size="28" font-weight="400" text-anchor="start" fill="#566b78">GPT-2 · FP32 参数 + BF16 autocast · 从输入、前向与反向，到 AdamW 更新</text><rect x="56" y="280" width="744" height="1290" rx="24" fill="#ffffff" stroke="#dce5e9" stroke-width="2"/><rect x="856" y="280" width="664" height="1290" rx="24" fill="#ffffff" stroke="#dce5e9" stroke-width="2"/><rect x="1576" y="280" width="768" height="1290" rx="24" fill="#ffffff" stroke="#dce5e9" stroke-width="2"/><path d="M 428 472 L 428 515" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="428,515 434.0,501.0 422.0,501.0" fill="#526773"/><path d="M 428 637 L 428 681" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="428,681 434.0,667.0 422.0,667.0" fill="#526773"/><path d="M 428 925 L 428 970" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="428,970 434.0,956.0 422.0,956.0" fill="#526773"/><path d="M 428 1116 L 428 1160" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="428,1160 434.0,1146.0 422.0,1146.0" fill="#526773"/><path d="M 428 1269 L 428 1314" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="428,1314 434.0,1300.0 422.0,1300.0" fill="#526773"/><path d="M 1188 494 L 1188 560" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1188,560 1194.0,546.0 1182.0,546.0" fill="#526773"/><path d="M 1188 744 L 1188 812" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1188,812 1194.0,798.0 1182.0,798.0" fill="#526773"/><path d="M 1188 978 L 1188 1040" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1188,1040 1194.0,1026.0 1182.0,1026.0" fill="#526773"/><path d="M 1960 682 L 1960 875" fill="none" stroke="#305eb8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1960,875 1966.0,861.0 1954.0,861.0" fill="#305eb8"/><path d="M 1960 1145 L 1960 1230" fill="none" stroke="#305eb8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1960,1230 1966.0,1216.0 1954.0,1216.0" fill="#305eb8"/><path d="M 1960 1380 L 1960 1420" fill="none" stroke="#305eb8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1960,1420 1966.0,1406.0 1954.0,1406.0" fill="#305eb8"/><path d="M 776 1387 L 838 1387 L 838 437 L 880 437" fill="none" stroke="#305eb8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="880,437 866.0,431.0 866.0,443.0" fill="#305eb8"/><path d="M 1496 1128 L 1548 1128 L 1548 963 L 1600 963" fill="none" stroke="#305eb8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1600,963 1586.0,957.0 1586.0,969.0" fill="#305eb8"/><path d="M 2320 473 L 2372 473 L 2372 252 L 812 252 L 812 760 L 776 760" fill="none" stroke="#305eb8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/><polygon points="776,760 790.0,766.0 790.0,754.0" fill="#305eb8"/><path d="M 1960 1512 L 1960 1595 L 30 1595 L 30 426 L 80 426" fill="none" stroke="#526773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/><polygon points="80,426 66.0,420.0 66.0,432.0" fill="#526773"/><rect x="60" y="168" width="112" height="38" rx="12" fill="#edf3ff" stroke="#edf3ff" stroke-width="2"/><text x="116.0" y="195" font-size="23" font-weight="650" text-anchor="middle" fill="#305eb8">FP32</text><text x="186" y="195" font-size="24" font-weight="400" text-anchor="start" fill="#566b78">参数 / 部分结果</text><rect x="420" y="168" width="112" height="38" rx="12" fill="#e8f6f2" stroke="#e8f6f2" stroke-width="2"/><text x="476.0" y="195" font-size="23" font-weight="650" text-anchor="middle" fill="#087b70">BF16</text><text x="546" y="195" font-size="24" font-weight="400" text-anchor="start" fill="#566b78">部分运算的输入 / 输出</text><rect x="850" y="168" width="112" height="38" rx="12" fill="#fff5e5" stroke="#fff5e5" stroke-width="2"/><text x="906.0" y="195" font-size="23" font-weight="650" text-anchor="middle" fill="#99631b">混合</text><text x="976" y="195" font-size="24" font-weight="400" text-anchor="start" fill="#566b78">按路径选择类型</text><rect x="1225" y="168" width="112" height="38" rx="12" fill="#edf1f4" stroke="#edf1f4" stroke-width="2"/><text x="1281.0" y="195" font-size="23" font-weight="650" text-anchor="middle" fill="#526773">int64</text><text x="1351" y="195" font-size="24" font-weight="400" text-anchor="start" fill="#566b78">Token ID / 标签</text><text x="2336" y="195" font-size="23" font-weight="400" text-anchor="end" fill="#566b78">色块表示 Tensor 的存储类型</text><text x="82" y="331" font-size="30" font-weight="750" text-anchor="start" fill="#087b70">01</text><text x="140" y="331" font-size="32" font-weight="700" text-anchor="start" fill="#142d3b">前向计算</text><text x="774" y="331" font-size="23" font-weight="400" text-anchor="end" fill="#566b78">autocast 区域内</text><text x="882" y="331" font-size="30" font-weight="750" text-anchor="start" fill="#087b70">02</text><text x="940" y="331" font-size="32" font-weight="700" text-anchor="start" fill="#142d3b">反向传播</text><text x="1494" y="331" font-size="23" font-weight="400" text-anchor="end" fill="#566b78">autocast 区域外</text><text x="1602" y="331" font-size="30" font-weight="750" text-anchor="start" fill="#087b70">03</text><text x="1660" y="331" font-size="32" font-weight="700" text-anchor="start" fill="#142d3b">参数更新</text><text x="2318" y="331" font-size="23" font-weight="400" text-anchor="end" fill="#566b78">autocast 区域外</text><rect x="80" y="380" width="696" height="92" rx="18" fill="#edf1f4" stroke="#dce5e9" stroke-width="2"/><path d="M 81 402 V 450" stroke="#526773" stroke-width="5"/><text x="104" y="423" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">输入 x / 正确目标 y</text><rect x="642" y="397" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="698.0" y="424" font-size="23" font-weight="650" text-anchor="middle" fill="#526773">int64</text><text x="104" y="456" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">[B,T] 整数 ID；本步已清空旧梯度</text><rect x="80" y="515" width="696" height="122" rx="18" fill="#edf3ff" stroke="#dce5e9" stroke-width="2"/><path d="M 81 537 V 615" stroke="#305eb8" stroke-width="5"/><text x="104" y="558" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">Embedding / 位置向量 → LN</text><rect x="642" y="532" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="698.0" y="559" font-size="23" font-weight="650" text-anchor="middle" fill="#305eb8">FP32</text><text x="104" y="591" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">查 FP32 参数表，得到浮点特征 X32</text><text x="104" y="625" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">本例查表、LN 输出保持 FP32</text><rect x="80" y="681" width="696" height="244" rx="18" fill="#e8f6f2" stroke="#dce5e9" stroke-width="2"/><path d="M 81 703 V 903" stroke="#087b70" stroke-width="5"/><text x="104" y="724" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">Linear / 矩阵乘法</text><rect x="642" y="698" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="698.0" y="725" font-size="23" font-weight="650" text-anchor="middle" fill="#087b70">BF16</text><text x="104" y="760" font-size="26" font-weight="600" text-anchor="start" fill="#087b70">特征 X32 → X16       权重 W32 → W16</text><text x="104" y="807" font-size="27" font-weight="600" text-anchor="start" fill="#142d3b">BF16 输入 × BF16 权重 → BF16 输出</text><text x="104" y="852" font-size="24" font-weight="400" text-anchor="start" fill="#566b78">原始 X32、W32 不因这次转换而改 dtype</text><text x="104" y="894" font-size="24" font-weight="400" text-anchor="start" fill="#566b78">内部：A100 Tensor Core 可用 FP32 累加¹</text><rect x="80" y="970" width="696" height="146" rx="18" fill="#fff5e5" stroke="#dce5e9" stroke-width="2"/><path d="M 81 992 V 1094" stroke="#99631b" stroke-width="5"/><text x="104" y="1013" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">Transformer 中反复执行</text><rect x="642" y="987" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="698.0" y="1014" font-size="23" font-weight="650" text-anchor="middle" fill="#99631b">混合</text><text x="104" y="1046" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">线性层输出 BF16；本例 LN / 残差结果 FP32</text><text x="104" y="1080" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">按算子选择精度，逐层保留计算图</text><rect x="80" y="1160" width="696" height="109" rx="18" fill="#e8f6f2" stroke="#dce5e9" stroke-width="2"/><path d="M 81 1182 V 1247" stroke="#087b70" stroke-width="5"/><text x="104" y="1203" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">最终 LN → lm_head</text><rect x="642" y="1177" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="698.0" y="1204" font-size="23" font-weight="650" text-anchor="middle" fill="#087b70">BF16</text><text x="104" y="1236" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">FP32 特征 → 输出 logits [B,T,V]</text><rect x="80" y="1314" width="696" height="146" rx="18" fill="#edf3ff" stroke="#dce5e9" stroke-width="2"/><path d="M 81 1336 V 1438" stroke="#305eb8" stroke-width="5"/><text x="104" y="1357" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">交叉熵 loss</text><rect x="642" y="1331" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="698.0" y="1358" font-size="23" font-weight="650" text-anchor="middle" fill="#305eb8">FP32</text><text x="104" y="1390" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">logits 转 FP32，与 int64 标签 y 计算</text><text x="104" y="1424" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">输出标量 L；转换也记录在计算图中</text><rect x="880" y="380" width="616" height="114" rx="18" fill="#edf3ff" stroke="#dce5e9" stroke-width="2"/><path d="M 881 402 V 472" stroke="#305eb8" stroke-width="5"/><text x="904" y="423" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">起点：loss 标量</text><rect x="1362" y="397" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="1418.0" y="424" font-size="23" font-weight="650" text-anchor="middle" fill="#305eb8">FP32</text><text x="904" y="456" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">调用 loss.backward()，沿计算图反传</text><rect x="880" y="560" width="616" height="184" rx="18" fill="#fff5e5" stroke="#dce5e9" stroke-width="2"/><path d="M 881 582 V 722" stroke="#99631b" stroke-width="5"/><text x="904" y="603" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">沿各条计算路径传回梯度</text><rect x="1362" y="577" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="1418.0" y="604" font-size="23" font-weight="650" text-anchor="middle" fill="#99631b">混合</text><text x="904" y="636" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">logits 的梯度：BF16</text><text x="904" y="670" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">FP32 残差分支：FP32 梯度</text><text x="904" y="704" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">中间梯度类型随对应路径变化</text><rect x="880" y="812" width="616" height="166" rx="18" fill="#fff5e5" stroke="#dce5e9" stroke-width="2"/><path d="M 881 834 V 956" stroke="#99631b" stroke-width="5"/><text x="904" y="855" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">经过参数的类型转换节点</text><text x="904" y="888" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">以线性层的 BF16 权重分支为例：</text><text x="904" y="922" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">g16 → cast(FP32) → g32</text><text x="904" y="956" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">转换保留计算图与原参数的连接</text><rect x="880" y="1040" width="616" height="176" rx="18" fill="#edf3ff" stroke="#dce5e9" stroke-width="2"/><path d="M 881 1062 V 1194" stroke="#305eb8" stroke-width="5"/><text x="904" y="1083" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">累积到原参数 W.grad</text><rect x="1362" y="1057" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="1418.0" y="1084" font-size="23" font-weight="650" text-anchor="middle" fill="#305eb8">FP32</text><text x="904" y="1116" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">梯度存储类型与原参数一致：FP32</text><text x="904" y="1150" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">同一参数的多条使用路径在这里相加</text><text x="904" y="1184" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">共享的 wte / lm_head 也是同一份梯度</text><rect x="880" y="1314" width="616" height="146" rx="18" fill="#f7f9fb" stroke="#dce5e9" stroke-width="2"/><text x="904" y="1355" font-size="27" font-weight="650" text-anchor="start" fill="#142d3b">反向结束：得到了更新依据</text><text x="904" y="1396" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">W.grad 已有梯度；原参数 W 的数值</text><text x="904" y="1432" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">此时仍保持本轮前向时的值。</text><rect x="1600" y="380" width="720" height="302" rx="18" fill="#edf3ff" stroke="#dce5e9" stroke-width="2"/><path d="M 1601 402 V 660" stroke="#305eb8" stroke-width="5"/><text x="1624" y="423" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">全程保留的训练状态</text><rect x="2186" y="397" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="2242.0" y="424" font-size="23" font-weight="650" text-anchor="middle" fill="#305eb8">FP32</text><text x="1624" y="473" font-size="31" font-weight="700" text-anchor="start" fill="#305eb8">原始参数 W</text><text x="1624" y="516" font-size="26" font-weight="400" text-anchor="start" fill="#566b78">前向的 BF16 权重由它转换得到</text><text x="1624" y="576" font-size="30" font-weight="700" text-anchor="start" fill="#305eb8">AdamW 历史统计 m、v</text><text x="1624" y="618" font-size="26" font-weight="400" text-anchor="start" fill="#566b78">首步创建；以后每批沿用并更新</text><text x="1624" y="655" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">本课这三份持久状态均保持 FP32</text><rect x="1600" y="875" width="720" height="270" rx="18" fill="#edf3ff" stroke="#dce5e9" stroke-width="2"/><path d="M 1601 897 V 1123" stroke="#305eb8" stroke-width="5"/><text x="1624" y="918" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">optimizer.step()</text><rect x="2186" y="892" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="2242.0" y="919" font-size="23" font-weight="650" text-anchor="middle" fill="#305eb8">FP32</text><text x="1624" y="963" font-size="28" font-weight="600" text-anchor="start" fill="#142d3b">输入：W + W.grad + 历史 m / v</text><text x="1624" y="1007" font-size="27" font-weight="400" text-anchor="start" fill="#566b78">更新 m、v → 偏差修正 → 计算更新量</text><text x="1624" y="1055" font-size="25" font-weight="600" text-anchor="start" fill="#305eb8">W_new = (1 − ηλ)W − η m̂ / (√v̂ + ε)</text><text x="1624" y="1105" font-size="28" font-weight="650" text-anchor="start" fill="#142d3b">把新数值写回同一个原始 FP32 参数</text><rect x="1600" y="1230" width="720" height="150" rx="18" fill="#edf3ff" stroke="#dce5e9" stroke-width="2"/><path d="M 1601 1252 V 1358" stroke="#305eb8" stroke-width="5"/><text x="1624" y="1273" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">更新后的原参数 W</text><rect x="2186" y="1247" width="112" height="38" rx="12" fill="white" stroke="white" stroke-width="2"/><text x="2242.0" y="1274" font-size="23" font-weight="650" text-anchor="middle" fill="#305eb8">FP32</text><text x="1624" y="1306" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">细小变化在 FP32 参数中继续累积</text><text x="1624" y="1340" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">下一批使用这份新参数和更新后的 m / v</text><rect x="1600" y="1420" width="720" height="92" rx="18" fill="#e8f6f2" stroke="#dce5e9" stroke-width="2"/><path d="M 1601 1442 V 1490" stroke="#087b70" stroke-width="5"/><text x="1624" y="1463" font-size="29" font-weight="650" text-anchor="start" fill="#142d3b">下一批：重新按需转换</text><text x="1624" y="1496" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">新 W32 → 新 W16，进入下一次前向</text><text x="1984" y="781" font-size="25" font-weight="400" text-anchor="start" fill="#305eb8">沿用原始状态</text><text x="826" y="1499" font-size="23" font-weight="400" text-anchor="end" fill="#305eb8">L → 反向</text><text x="1552" y="1181" font-size="23" font-weight="400" text-anchor="middle" fill="#305eb8">梯度</text><text x="1160" y="241" font-size="24" font-weight="400" text-anchor="start" fill="#305eb8">前向从原始 W32 取值；计算用副本保持与原参数的连接</text><text x="1110" y="1631" font-size="27" font-weight="400" text-anchor="middle" fill="#566b78">下一批：保留更新后的参数与 m / v，取新数据，zero_grad 清空旧梯度</text><rect x="56" y="1680" width="744" height="150" rx="18" fill="#edf3ff" stroke="#edf3ff" stroke-width="2"/><text x="80" y="1724" font-size="28" font-weight="700" text-anchor="start" fill="#305eb8">参数保存精度 ≠ 运算输入精度</text><text x="80" y="1768" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">原始参数一直是 FP32；BF16 表示用于部分运算。</text><text x="80" y="1803" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">优化器更新的对象始终是原始参数。</text><rect x="856" y="1680" width="664" height="150" rx="18" fill="#e8f6f2" stroke="#e8f6f2" stroke-width="2"/><text x="880" y="1724" font-size="27" font-weight="700" text-anchor="start" fill="#087b70">BF16 → FP32：不会恢复已丢失的细节</text><text x="880" y="1768" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">1.234375（BF16）→ 1.234375（FP32）</text><text x="880" y="1803" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">扩展后的低位补零；随后可参与 FP32 更新。</text><rect x="1576" y="1680" width="768" height="150" rx="18" fill="#fff5e5" stroke="#fff5e5" stroke-width="2"/><text x="1600" y="1724" font-size="28" font-weight="700" text-anchor="start" fill="#99631b">反向在 autocast 外，仍包含混合精度</text><text x="1600" y="1768" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">中间梯度沿前向图回传；W.grad 最终为 FP32。</text><text x="1600" y="1803" font-size="25" font-weight="400" text-anchor="start" fill="#566b78">图示范围：本课 FP32 参数 + BF16 autocast。</text><text x="58" y="1871" font-size="21" font-weight="400" text-anchor="start" fill="#566b78">¹ 内部累加以 A100 Tensor Core 为例，具体内核依设备与配置而定。节点 dtype 对照本项目 PyTorch 2.2.2 CPU 实测；源码与依据见配套说明。</text>
