<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="3041" viewBox="0 0 2600 3041">
<title>3/3  MLP、第二次残差与词表打分：输入 → 计算 → 输出</title><desc>逐步标注输入、参数、计算、输出形状和差异 A 到 F；数字为缩小教学配置。</desc>
<style>text {font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;}</style>
<rect width="2600" height="3041" fill="#f5f8fb"/><text x="65" y="80" font-size="48" fill="#183044" font-weight="700" text-anchor="start">3/3  MLP、第二次残差与词表打分：输入 → 计算 → 输出</text><text x="65" y="135" font-size="31" fill="#183044" font-weight="400" text-anchor="start">蓝色 GPT-2 ｜ 绿色 Llama 3 ｜ 橙色差异带：明确标出改变了什么</text><text x="65" y="187" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">教学设置：B=2、T=5、D=16、词表 Vocab=100；Q 头=4；GPT-2 KV 头=4，Llama KV 头=2；每头 4 维。</text><text x="65" y="231" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">按推理 eval 模式展开公共前向，不画 Dropout/KV Cache；MLP 宽度 64 vs 48 仅为教学，并非等参数量实验。</text><text x="65" y="275" font-size="27" fill="#526a7b" font-weight="400" text-anchor="start">索引：b 样本，t/i/j 位置（lm_head 的 j 为词表 ID），h 头，d/k 特征；⊙ 逐元素乘，Σ 求和；各模型参数独立。</text><rect x="60" y="320" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="364" font-size="32" fill="#183044" font-weight="700" text-anchor="start">13  第二次归一化</text><text x="1240" y="364" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 B · 独立的一组归一化参数</text><rect x="82" y="404" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="446" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="491" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：R [2,5,16]；参数 γ₂、β₂ 各 [16]</text><text x="106" y="532" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：μR = (Σd Rd)/16；σR² = Σd(Rd−μR)²/16</text><text x="106" y="573" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Zd = γ₂,d × (Rd−μR)/√(σR²+ε) + β₂,d</text><text x="106" y="614" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Z [2,5,16]；交给 MLP</text><text x="106" y="655" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">说明：γ₂、β₂ 与第 03 步的参数分别学习</text><rect x="1382" y="404" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="446" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="491" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：R [2,5,16]；参数 γ₂ [16]，没有 β₂</text><text x="1406" y="532" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：rR = √((Σd Rd²)/16 + ε)</text><text x="1406" y="573" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Zd = γ₂,d × Rd/rR</text><text x="1406" y="614" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Z [2,5,16]；交给 MLP</text><text x="1406" y="655" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">说明：γ₂ 与第 03 步的 γ₁ 是不同参数</text><rect x="60" y="753" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="797" font-size="32" fill="#183044" font-weight="700" text-anchor="start">14  前馈网络：逐位置加工特征</text><text x="1240" y="797" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 E · GELU / SwiGLU；差异 D · bias</text><rect x="82" y="837" width="1090" height="374" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="879" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="924" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Z [2,5,16]</text><text x="106" y="965" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：W₁ [16,64]、b₁ [64]；W₂ [64,16]、b₂ [16]</text><text x="106" y="1006" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">扩展：a = Z W₁ + b₁ → [2,5,64]</text><text x="106" y="1047" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">激活：g = 0.5a × (1+tanh(√(2/π)×(a+0.044715a³)))</text><text x="106" y="1088" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">说明：上式为逐元素 GELU 的 tanh 近似；g [2,5,64]</text><text x="106" y="1129" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">缩回：Fout = g W₂ + b₂ → [2,5,16]</text><text x="106" y="1170" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：线性混合 → 非线性变换 → 线性混合</text><rect x="1382" y="837" width="1090" height="374" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="879" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="924" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Z [2,5,16]；教学中间宽度设 F=48</text><text x="1406" y="965" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：Wg、Wv 各 [16,48]；Wd [48,16]；无 bias</text><text x="1406" y="1006" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">两路扩展：a = Z Wg；v = Z Wv → 都为 [2,5,48]</text><text x="1406" y="1047" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">门控激活：g = SiLU(a) = a/(1+exp(−a)) → [2,5,48]</text><text x="1406" y="1088" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">逐元素相乘：u = g ⊙ v → [2,5,48]</text><text x="1406" y="1129" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">缩回：Fout = u Wd → [2,5,16]</text><text x="1406" y="1170" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：用一条分支调节另一条分支，再混合回 D 维</text><rect x="60" y="1268" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="1312" font-size="32" fill="#183044" font-weight="700" text-anchor="start">15  第二次残差相加</text><text x="1240" y="1312" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同 · 加回的是 R</text><rect x="82" y="1352" width="1090" height="251" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="1394" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="1439" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：第 12 步保留的 R；第 14 步输出 Fout</text><text x="106" y="1480" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Y[b,t,d] = R[b,t,d] + Fout[b,t,d]</text><text x="106" y="1521" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Y [2,5,16]，作为当前 Block 的最终输出</text><text x="106" y="1562" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">注意：这里加回 R，不是再次加 X，也不是加 Z</text><rect x="1382" y="1352" width="1090" height="251" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="1394" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="1439" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：第 12 步保留的 R；第 14 步输出 Fout</text><text x="1406" y="1480" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Y[b,t,d] = R[b,t,d] + Fout[b,t,d]</text><text x="1406" y="1521" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Y [2,5,16]，作为当前 Block 的最终输出</text><text x="1406" y="1562" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">注意：这里加回 R，不是再次加 X，也不是加 Z</text><rect x="60" y="1660" width="2480" height="67" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/><text x="82" y="1704" font-size="32" fill="#183044" font-weight="700" text-anchor="start">16  继续后续 Block</text><text x="1240" y="1704" font-size="29" fill="#526a7b" font-weight="650" text-anchor="start">相同 · 同构但参数独立</text><rect x="82" y="1744" width="1090" height="292" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="106" y="1786" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="1831" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：当前层的 Y [2,5,16]</text><text x="106" y="1872" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：令下一层 X=Y，重复第 02—15 步</text><text x="106" y="1913" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：每层拥有自己的归一化、注意力和 MLP 参数</text><text x="106" y="1954" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：最后一个 Block 的结果 XL [2,5,16]</text><text x="106" y="1995" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">说明：L 是层数；本图只展开其中一层</text><rect x="1382" y="1744" width="1090" height="292" rx="18" fill="white" stroke="#d7e3ed" stroke-width="2"/><text x="1406" y="1786" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="1831" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：当前层的 Y [2,5,16]</text><text x="1406" y="1872" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：令下一层 X=Y，重复第 02—15 步</text><text x="1406" y="1913" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：每层拥有自己的归一化、注意力和 MLP 参数</text><text x="1406" y="1954" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：最后一个 Block 的结果 XL [2,5,16]</text><text x="1406" y="1995" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">说明：L 是层数；本图只展开其中一层</text><rect x="60" y="2093" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="2137" font-size="32" fill="#183044" font-weight="700" text-anchor="start">17  最终归一化</text><text x="1240" y="2137" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 B · Block 之外的最后一次归一化</text><rect x="82" y="2177" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="2219" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="2264" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：XL [2,5,16]；参数 γf、βf 各 [16]</text><text x="106" y="2305" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：μf = (Σd XL,d)/16；σf² = Σd(XL,d−μf)²/16</text><text x="106" y="2346" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Hf,d = γf,d × (XL,d−μf)/√(σf²+ε) + βf,d</text><text x="106" y="2387" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Hf [2,5,16]；交给 lm_head</text><text x="106" y="2428" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：在词表打分前调整最终表示的尺度</text><rect x="1382" y="2177" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="2219" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="2264" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：XL [2,5,16]；参数 γf [16]，没有 βf</text><text x="1406" y="2305" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：rf = √((Σd XL,d²)/16 + ε)</text><text x="1406" y="2346" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：Hf,d = γf,d × XL,d/rf</text><text x="1406" y="2387" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：Hf [2,5,16]；交给 lm_head</text><text x="1406" y="2428" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">目的：在词表打分前调整最终表示的尺度</text><rect x="60" y="2526" width="2480" height="67" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="82" y="2570" font-size="32" fill="#183044" font-weight="700" text-anchor="start">18  lm_head：给每个词表 ID 打分</text><text x="1240" y="2570" font-size="29" fill="#a66522" font-weight="650" text-anchor="start">差异 F · 输出表是否与输入表共享</text><rect x="82" y="2610" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="106" y="2652" font-size="31" fill="#355fc0" font-weight="700" text-anchor="start">GPT-2</text><text x="106" y="2697" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Hf [2,5,16]；输入 Embedding 表 E [100,16]</text><text x="106" y="2738" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：复用 E；lm_head 不带 bias</text><text x="106" y="2779" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：logits[b,t,j] = Σd Hf[b,t,d] × E[j,d]</text><text x="106" y="2820" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：logits [2,5,100]；j=0…99，代表候选 Token ID</text><text x="106" y="2861" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">用途：训练计算交叉熵；生成用末位置 logits 选择下一 Token</text><rect x="1382" y="2610" width="1090" height="292" rx="18" fill="#fffaf2" stroke="#e8c38e" stroke-width="2"/><text x="1406" y="2652" font-size="31" fill="#087e75" font-weight="700" text-anchor="start">Llama 3</text><text x="1406" y="2697" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输入：Hf [2,5,16]；独立输出表 Wout [100,16]</text><text x="1406" y="2738" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">参数：Wout 与 E 分别学习；lm_head 不带 bias</text><text x="1406" y="2779" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">计算：logits[b,t,j] = Σd Hf[b,t,d] × Wout[j,d]</text><text x="1406" y="2820" font-size="28" fill="#183044" font-weight="550" text-anchor="start">输出：logits [2,5,100]；这些分数还不是概率</text><text x="1406" y="2861" font-size="28" fill="#526a7b" font-weight="400" text-anchor="start">范围：此处指原始 Llama 3；其他型号的共享设置须单独看配置</text><text x="65" y="2964" font-size="26" fill="#526a7b" font-weight="400" text-anchor="start">读图：同一行横向比较；纵向按编号追踪张量。名称带 W、E、P、γ、β、b 的参数，与本次前向算出的张量要分清。</text><text x="65" y="3008" font-size="25" fill="#526a7b" font-weight="400" text-anchor="start">来源：Raschka GPT→Llama 教程、Meta Llama 3 官方 model.py、本项目 GPT-2 前向；Llama 3 不含 Qwen3 的 QK-Norm。</text></svg>